<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Cinzel'; src: url('fonts/Cinzel-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Cinzel'; src: url('fonts/Cinzel-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Corm'; src: url('fonts/Cormorant-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Vibes'; src: url('fonts/GreatVibes.ttf'); }
  @font-face { font-family: 'Allura'; src: url('fonts/Allura.ttf'); }
  @font-face { font-family: 'Yellowtail'; src: url('fonts/Yellowtail.ttf'); }
  @font-face { font-family: 'Damion'; src: url('fonts/Damion.ttf'); }
  @font-face { font-family: 'Bebas'; src: url('fonts/BebasNeue.ttf'); }
  @font-face { font-family: 'Anton'; src: url('fonts/Anton.ttf'); }
  @font-face { font-family: 'Elite'; src: url('fonts/SpecialElite.ttf'); }
  @font-face { font-family: 'RockSalt'; src: url('fonts/RockSalt.ttf'); }
  @font-face { font-family: 'MontAlt'; src: url('fonts/MontAlt.ttf'); }
  @font-face { font-family: 'PlayIt'; src: url('fonts/PlayfairItalic.ttf'); }
  html,body{margin:0;background:#000;overflow:hidden} canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =====================================================================
   "Podcast caption reel" (Jebrix-style kinetic captions), 30 fps, 574 fr.
   Units: native source px (368 x 656); K scales to the 1080x1920 canvas.
   Per frame:  background(shot) -> BACK captions -> PERSON cutout
               -> FRONT captions -> watermark -> transitions/post.
   Frame F is 1-based (F1 = 0.000 s).
   ===================================================================== */
const W = 368, H = 656, K = 1080 / 368;
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
const cfg = window.CFG || {};
const BRAND = cfg.brand || 'EFEKTIVE', BRAND_SUB = cfg.brandSub || 'present';
let FI = 1, CUT = {}, BG = {};
const ORANGE = '#f07a2c', GOLD1 = '#ffe08a', GOLD2 = '#f2a51a';

/* ---------------- utils ---------------- */
const cl = x => Math.max(0, Math.min(1, x));
const P = (F, a, b) => cl((F - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eOut3 = t => 1 - Math.pow(1 - t, 3), eIn3 = t => t * t * t;
const eIO3 = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOutBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function layer() { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return [c, c.getContext('2d')]; }
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
function scr(g) { g.setTransform(K, 0, 0, K, 0, 0); }

/* ---------------- text sprites (sub-pixel smooth, cached) ---------------- */
const SPR = new Map(), SS = 3 * K;   // sprite px per native px
function fontPx(f) { const m = f.match(/([\d.]+)px/); return m ? +m[1] : 20; }
function measure(str, font, ls = 0) { const g = ctx; g.save(); g.font = font; g.letterSpacing = ls + 'px'; const w = g.measureText(str).width - ls; g.restore(); return w; }
/* style: {fill, grad:[c0,c1,dir], stroke, strokeW, glow, glowColor, shadow, extrude, ls} */
function sprite(str, font, st) {
  const key = str + '|' + font + '|' + JSON.stringify(st);
  let sp = SPR.get(key); if (sp) return sp;
  const ls = st.ls || 0, w = measure(str, font, ls), size = fontPx(font);
  const pad = Math.ceil(size * 0.6 + (st.glow || 0) * 2.2 + (st.extrude || 0) * 1.5 + 8);
  const asc = Math.ceil(size * 1.1), desc = Math.ceil(size * 0.6);
  const c = document.createElement('canvas'); c.width = Math.ceil((w + 2 * pad) * SS); c.height = Math.ceil((asc + desc + 2 * pad) * SS);
  const g = c.getContext('2d'); g.scale(SS, SS); g.translate(pad, pad + asc);
  g.font = font; g.letterSpacing = ls + 'px'; g.textBaseline = 'alphabetic';
  const fill = () => {
    if (!st.grad) return st.fill || '#fff';
    const [a, b, dir] = st.grad; const gr = dir === 'h' ? g.createLinearGradient(0, 0, w, 0) : g.createLinearGradient(0, -size * 0.8, 0, size * 0.1);
    gr.addColorStop(0, a); gr.addColorStop(1, b); return gr;
  };
  if (st.shadow) { g.save(); g.shadowColor = st.shadow; g.shadowBlur = size * 0.35 * SS; g.shadowOffsetY = size * 0.08 * SS; g.fillStyle = 'rgba(0,0,0,0.01)'; g.fillText(str, 0, 0); g.restore(); }
  if (st.extrude) { for (let i = st.extrude; i > 0; i--) { g.fillStyle = `rgba(${40 + i * 4},${40 + i * 4},${44 + i * 4},1)`; g.fillText(str, i * 0.5, i * 0.7); } }
  if (st.glow) { g.save(); g.shadowColor = st.glowColor || GOLD2; g.shadowBlur = st.glow * SS; g.fillStyle = st.stroke && !st.fill && !st.grad ? 'rgba(0,0,0,0)' : fill();
    if (st.stroke && !st.fill && !st.grad) { g.strokeStyle = st.stroke; g.lineWidth = st.strokeW || 1; g.strokeText(str, 0, 0); g.strokeText(str, 0, 0); } else { g.fillText(str, 0, 0); g.fillText(str, 0, 0); } g.restore(); }
  if (st.fill || st.grad) { g.fillStyle = fill(); g.fillText(str, 0, 0); }
  if (st.stroke) { g.strokeStyle = st.stroke; g.lineWidth = st.strokeW || 1; g.lineJoin = 'round'; g.strokeText(str, 0, 0); }
  if (st.bevel) { g.save(); g.globalCompositeOperation = 'source-atop'; const gr = g.createLinearGradient(0, -size * 0.8, 0, size * 0.1); gr.addColorStop(0, 'rgba(255,255,255,0.0)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.0)'); gr.addColorStop(1, 'rgba(0,0,0,0.28)'); g.fillStyle = gr; g.fillRect(-pad, -asc - pad, w + 2 * pad, asc + desc + 2 * pad); g.restore(); }
  sp = { c, ox: pad, oy: pad + asc, w };
  if (SPR.size > 900) SPR.clear(); SPR.set(key, sp); return sp;
}
/* draw a text with animation params */
function txt(g, str, x, y, font, st, o = {}) {
  const sp = sprite(str, font, st);
  let ax = x; if (o.align === 'center') ax -= sp.w / 2; else if (o.align === 'right') ax -= sp.w;
  const a = o.alpha == null ? 1 : o.alpha; if (a <= 0.003) return sp.w;
  g.save(); g.globalAlpha *= a;
  g.translate(ax + sp.w / 2 + (o.dx || 0), y + (o.dy || 0)); if (o.rot) g.rotate(o.rot); const sc = o.sc || 1; g.scale(sc * (o.sx || 1), sc);
  g.translate(-sp.w / 2, 0);
  if (o.blur > 0.05) g.filter = `blur(${o.blur * K}px)`;
  if (o.clip != null) { g.beginPath(); g.rect(-6, -400, (sp.w + 12) * o.clip, 800); g.clip(); }
  g.drawImage(sp.c, -sp.ox, -sp.oy, sp.c.width / SS, sp.c.height / SS);
  g.restore(); return sp.w;
}
/* generic caption animator.  e = {f0,f1,str,x,y,font,st,align,in,out,din,dout,rot,layer}  */
function cap(g, F, e) {
  if (F < e.f0 - 0.5 || F > e.f1 + 0.5) return;
  const din = e.din || 4, dout = e.dout || 3;
  const pi = P(F, e.f0, e.f0 + din), po = P(F, e.f1 - dout, e.f1);
  const o = { align: e.align || 'left', rot: e.rot || 0, alpha: 1, blur: 0, sc: 1, dx: 0, dy: 0 };
  const ein = eOut3(pi);
  switch (e.in || 'fade') {
    case 'fade': o.alpha = ein; o.blur = 5 * (1 - ein); o.sc = lerp(1.08, 1, ein); break;
    case 'pop': o.alpha = cl(pi * 2.5); o.blur = 6 * (1 - ein); o.sc = lerp(1.45, 1, eOutBack(pi, 1.2)); break;
    case 'drop': o.alpha = cl(pi * 2); o.blur = 6 * (1 - ein); o.dy = -38 * (1 - ein); break;
    case 'rise': o.alpha = cl(pi * 2); o.blur = 5 * (1 - ein); o.dy = 26 * (1 - ein); break;
    case 'slideL': o.alpha = cl(pi * 2); o.blur = 5 * (1 - ein); o.dx = -40 * (1 - ein); break;
    case 'write': o.clip = eIO3(pi); o.alpha = cl(pi * 3); break;
    case 'flicker': o.alpha = pi < 1 ? (rnd(FI * 3 + e.y) > 0.4 ? 1 : 0.15) * cl(pi * 3) : 1; o.blur = 2 * (1 - pi); break;
    case 'cut': break;
  }
  if (po > 0) {
    const eo = eIn3(po);
    switch (e.out || 'fade') {
      case 'fade': o.alpha *= 1 - eo; o.blur += 6 * eo; o.sc *= lerp(1, 1.06, eo); break;
      case 'glitch': o.alpha *= rnd(FI * 7 + e.x) > po ? 1 : 0; o.dx += (rnd(FI + e.y) - 0.5) * 18 * po; break;
      case 'rise': o.alpha *= 1 - eo; o.dy -= 20 * eo; o.blur += 4 * eo; break;
      case 'cut': break;
    }
  }
  if (e.float) { o.dy += Math.sin(F * 0.07 + e.x) * e.float; }
  txt(g, e.str, e.x, e.y, e.font, e.st, o);
}

/* ---------------- fonts & styles ---------------- */
const fCin = (s, w = 700) => `${w} ${s}px Cinzel`;
const fCorm = s => `700 ${s}px Corm`;
const fVib = s => `${s}px Vibes`, fYel = s => `${s}px Yellowtail`;
const SH = 'rgba(0,0,0,0.75)';
const S_WHITE = { fill: '#fbf7f0', shadow: SH, bevel: true };
const S_WHITE_SOFT = { fill: '#f4efe8', shadow: 'rgba(0,0,0,0.55)' };
const S_EMBOSS = { grad: ['#ffffff', '#c9c4be'], shadow: SH, stroke: 'rgba(60,50,45,0.55)', strokeW: 0.8, bevel: true };
const S_NEON_PEACH = { stroke: '#ffe3d6', strokeW: 1.3, glow: 7, glowColor: '#ff9e7a' };
const S_NEON_WHITE = { stroke: '#ffffff', strokeW: 1.2, glow: 6, glowColor: 'rgba(255,255,255,0.9)' };
const S_ORANGE = { fill: ORANGE, glow: 6, glowColor: 'rgba(255,120,40,0.9)' };
const S_ORANGE_SCRIPT = { fill: '#f58a3c', glow: 4, glowColor: 'rgba(255,110,30,0.8)' };
const S_WHITE_SCRIPT = { fill: '#ffffff', glow: 4, glowColor: 'rgba(255,255,255,0.6)' };
const S_GOLD = { grad: [GOLD1, GOLD2], glow: 10, glowColor: 'rgba(255,170,30,0.95)', shadow: 'rgba(0,0,0,0.5)' };
const S_GOLD_NEON = { stroke: '#ffd25a', strokeW: 1.6, glow: 9, glowColor: 'rgba(255,170,20,1)', fill: 'rgba(120,70,0,0.35)' };
const S_3D = { fill: '#ffffff', extrude: 9, shadow: 'rgba(0,0,0,0.55)', bevel: true };
const S_SMALL = { fill: '#ffffff', shadow: 'rgba(0,0,0,0.6)' };

/* =====================================================================
   SHOTS
   ===================================================================== */
const SHOTS = [
  { id: 'S1', a: 1, b: 61, bg: 'warm' }, { id: 'S2', a: 62, b: 86, bg: 'warmClose' }, { id: 'S3', a: 87, b: 124, bg: 'broll' },
  { id: 'S4', a: 125, b: 271, bg: 'warm' }, { id: 'S5', a: 272, b: 317, bg: 'wall' }, { id: 'S6', a: 318, b: 439, bg: 'studio' },
  { id: 'S7', a: 440, b: 511, bg: 'grey' }, { id: 'S8', a: 512, b: 538, bg: 'greyClose' }, { id: 'S9', a: 539, b: 574, bg: 'end' }];
const shotOf = F => SHOTS.find(s => F >= s.a && F <= s.b) || SHOTS[SHOTS.length - 1];
/* background camera (zoom from the footage): scale around an anchor */
function bgCam(F) {
  if (F <= 61) { const s = F < 10 ? [3.0, 3.0, 2.0, 1.45, 1.25, 1.16, 1.12, 1.08, 1.05, 1.02][Math.max(0, Math.min(9, Math.floor(F)))] : 1; const s2 = F < 10 ? lerp(s, [3.0, 2.0, 1.45, 1.25, 1.16, 1.12, 1.08, 1.05, 1.02, 1.0][Math.floor(F)] || 1, F - Math.floor(F)) : 1; return { s: s2 * lerp(1, 1.04, P(F, 10, 61)), ax: 175, ay: 285 }; }
  if (F >= 125 && F <= 271) return { s: lerp(1.15, 1, eOut3(P(F, 125, 135))) * lerp(1, 1.05, P(F, 135, 271)), ax: 184, ay: 300 };
  const sh = shotOf(F); return { s: lerp(1, 1.04, P(F, sh.a, sh.b)), ax: 184, ay: 328 };
}

/* ---------------- procedural backgrounds (built once) ---------------- */
function mkBG(kind) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920; const g = c.getContext('2d');
  g.setTransform(K, 0, 0, K, 0, 0);
  const seats = (tone, rows, blur, seed, tilt) => {
    // bleacher rows: stepped seat-back blocks receding upward
    const [lc] = layer(); const l = lc.getContext('2d'); l.setTransform(K, 0, 0, K, 0, 0);
    l.fillStyle = tone.base; l.fillRect(0, 0, W, H);
    for (let r = 0; r < rows; r++) {
      const t = r / rows, y = H * 0.78 - t * H * 0.95 + (rnd(r * 5 + seed) - 0.5) * 8, sz = lerp(52, 18, t) * (0.85 + 0.3 * rnd(r + seed)), gap = sz * (0.2 + 0.3 * rnd(r * 2 + seed));
      for (let x = -60 + ((r * 37 + seed) % 40); x < W + 60; x += sz + gap) {
        const yy = y + (x / W) * tilt * sz;
        const lit = 0.55 + 0.45 * rnd(r * 31 + x * 0.7 + seed);
        l.fillStyle = tone.seat(lit, t);
        l.beginPath(); l.roundRect(x, yy, sz * 1.25, sz * 0.55, sz * 0.18); l.fill();
        l.fillStyle = tone.edge(lit, t); l.fillRect(x, yy, sz, sz * 0.12);
      }
    }
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.filter = `blur(${blur * K}px)`; g.drawImage(lc, 0, 0); g.restore();
  };
  const glow = (x, y, r, col) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  const vign = (a) => { const gr = g.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.45, H * 0.8); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  if (kind === 'warm' || kind === 'warmClose') {
    seats({ base: '#3a2216', seat: (l, t) => `rgb(${120 * l + 40},${70 * l + 25},${45 * l + 15})`, edge: (l) => `rgba(255,${170 + 40 * l},120,${0.35 * l})` }, kind === 'warm' ? 16 : 7, kind === 'warm' ? 5 : 11, 3, 0.6);
    g.globalCompositeOperation = 'screen'; glow(W * 1.05, H * 0.55, 200, 'rgba(255,110,20,0.75)'); glow(-20, H * 0.75, 160, 'rgba(255,100,20,0.55)'); glow(W * 0.6, H * 0.1, 260, 'rgba(255,170,90,0.35)');
    g.globalCompositeOperation = 'source-over';
    // table / desk at the bottom
    const dg = g.createLinearGradient(0, H * 0.93, 0, H); dg.addColorStop(0, 'rgba(150,140,140,0.0)'); dg.addColorStop(0.3, 'rgba(170,165,165,0.85)'); dg.addColorStop(1, 'rgba(120,115,115,1)');
    if (kind === 'warm') { g.fillStyle = dg; g.fillRect(0, H * 0.93, W, H * 0.07); }
    vign(0.45);
  } else if (kind === 'grey' || kind === 'greyClose') {
    seats({ base: '#3c3c3c', seat: (l) => `rgb(${70 + 120 * l},${70 + 120 * l},${70 + 120 * l})`, edge: (l) => `rgba(255,255,255,${0.3 * l})` }, kind === 'grey' ? 16 : 6, kind === 'grey' ? 4.2 : 10, 11, 0.5);
    if (kind === 'grey') { const dg = g.createLinearGradient(0, H * 0.9, 0, H); dg.addColorStop(0, 'rgba(160,160,160,0)'); dg.addColorStop(0.25, 'rgba(178,178,178,1)'); dg.addColorStop(1, 'rgba(140,140,140,1)'); g.fillStyle = dg; g.fillRect(0, H * 0.9, W, H * 0.1); }
    vign(0.5);
  } else if (kind === 'studio') {
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0c0807'); gr.addColorStop(1, '#1b1311'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'screen'; glow(W * 0.15, H * 0.62, 190, 'rgba(120,60,30,0.45)'); glow(W * 0.9, H * 0.35, 150, 'rgba(255,120,40,0.25)'); g.globalCompositeOperation = 'source-over';
    vign(0.5);
  } else if (kind === 'wall') {
    g.fillStyle = '#b9b7b4'; g.fillRect(0, 0, W, H);
    const id = g.getImageData(0, 0, 1080, 1920), d = id.data;   // concrete grain
    for (let i = 0; i < d.length; i += 4) { const px = (i / 4) % 1080, py = Math.floor(i / 4 / 1080); const n = (rnd(px * 0.013 + py * 7.1) - 0.5) * 18 + Math.sin(px * 0.011 + Math.sin(py * 0.007) * 3) * 6 + Math.sin(py * 0.004 + px * 0.002) * 8; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(id, 0, 0);
    const lg = g.createRadialGradient(W * 0.5, H * 0.4, 50, W * 0.5, H * 0.4, H * 0.75); lg.addColorStop(0, 'rgba(255,255,255,0.18)'); lg.addColorStop(1, 'rgba(0,0,0,0.25)'); g.fillStyle = lg; g.fillRect(0, 0, W, H);
  } else { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); }
  return c;
}
function drawBG(g, F, sh) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  if (sh.bg === 'broll') { broll(g, F); g.restore(); return; }
  if (sh.bg === 'end') { g.restore(); return; }
  const c = bgCam(F), img = BG[sh.bg];
  g.translate(c.ax * K, c.ay * K); g.scale(c.s, c.s); g.translate(-c.ax * K, -c.ay * K);
  g.drawImage(img, 0, 0); g.restore();
}

/* ---------------- S3: abstract b-roll (no third-party footage) ---------------- */
function broll(g, F) {
  const t = F - 87;
  g.fillStyle = '#030303'; g.fillRect(0, 0, cv.width, cv.height);
  g.save(); g.setTransform(K, 0, 0, K, 0, 0);
  g.globalCompositeOperation = 'lighter';
  // spray / water streaks rushing left -> right, monochrome, motion-blurred
  for (let i = 0; i < 46; i++) {
    const sp = 6 + rnd(i) * 10, y = H * (0.05 + 0.9 * rnd(i * 3.3)), len = 40 + rnd(i * 5) * 140;
    const x = ((rnd(i * 9) * (W + 300) + t * sp) % (W + 300)) - 150;
    const a = 0.08 + 0.22 * rnd(i * 2.2) * cl(t / 6);
    const gr = g.createLinearGradient(x, 0, x + len, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.7, `rgba(235,235,240,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x + len / 2, y + Math.sin(t * 0.2 + i) * 6, len / 2, 2 + rnd(i * 7) * 9, -0.25 + rnd(i) * 0.2, 0, Math.PI * 2); g.fill();
  }
  // a running silhouette suggestion: soft bright limbs sweeping
  const cx = lerp(120, 250, P(F, 87, 124)), cy = 300;
  g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 5; k++) { const ang = Math.sin(t * 0.45 + k * 1.3) * 0.9; g.save(); g.translate(cx + k * 6, cy + k * 12); g.rotate(ang - 0.6); const gr = g.createLinearGradient(0, -60, 0, 60); gr.addColorStop(0, 'rgba(200,200,205,0)'); gr.addColorStop(0.5, 'rgba(200,200,205,0.12)'); gr.addColorStop(1, 'rgba(200,200,205,0)'); g.fillStyle = gr; g.fillRect(-10, -90, 20, 180); g.restore(); }
  // water reflection band at the bottom
  for (let i = 0; i < 18; i++) { const y = H * 0.82 + i * 6, a = 0.18 * (1 - i / 18); g.fillStyle = `rgba(220,220,225,${a * (0.5 + 0.5 * Math.sin(t * 0.6 + i * 1.7))})`; g.fillRect(W * 0.2 + Math.sin(t * 0.3 + i) * 30, y, W * 0.6, 1.4); }
  g.restore();
  g.save(); g.filter = `blur(${3 * K}px)`; g.globalAlpha = 0.85; g.drawImage(cv, 0, 0); g.restore();
  // fade in from black, lighten towards the end (as the source footage brightens)
  g.fillStyle = `rgba(0,0,0,${0.55 * (1 - P(F, 87, 104))})`; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = `rgba(140,140,145,${0.25 * P(F, 100, 124)})`; g.globalCompositeOperation = 'screen'; g.fillRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   CAPTIONS  (native px, F ranges measured on the source)
   ===================================================================== */
const BACK = [
  // S1
  { f0: 7, f1: 61, str: 'IF', x: -6, y: 116, font: fCin(118, 400), st: S_NEON_PEACH, in: 'drop', din: 5, float: 0.8 },
  { f0: 12, f1: 61, str: 'you', x: 2, y: 160, font: fVib(52), st: { stroke: '#ffd9c8', strokeW: 1.1, glow: 6, glowColor: '#ff8a5a' }, in: 'write', din: 6 },
  { f0: 14, f1: 61, str: 'ARE', x: 22, y: 200, font: fCin(38, 400), st: S_ORANGE, in: 'fade', din: 4 },
