<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Script'; src: url('fonts/Italianno.ttf'); }
  @font-face { font-family: 'InterD'; src: url('fonts/InterDisplay-Regular.otf'); font-weight: 400; }
  @font-face { font-family: 'InterD'; src: url('fonts/InterDisplay-Medium.otf'); font-weight: 500; }
  @font-face { font-family: 'InterD'; src: url('fonts/InterDisplay-Bold.otf'); font-weight: 700; }
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =====================================================================
   "Spotlight kinetic reel" composition.
   World space = the 720x1280 reference frame of the source footage.
   Output canvas = 1080x1920 (K = 1.5).  Frame numbers F are 1-based
   source frame indices at 30 fps (F1 .. F223).
   Layer order (spotlight scenes):
     background(world) -> card(world) -> texts(world) -> shadow -> CHARACTER(screen)
     -> foreground (crosses, comet, plane)
   ===================================================================== */
const K = 1.5, W = 720, H = 1280;
const Y = '#FDFB3D', YRGB = [253, 251, 61];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SANS = "'InterD', 'Inter Display', 'Inter', sans-serif";
let CAM = {}, BG = null, CUT = {};
const cfg = window.CFG || {};
/* ---- copy (edit here, or inject window.CFG.text before init) ---- */
const TXT = Object.assign({
  a1: "You're not", a1b: "You're", script: 'competing', on: 'on', w1: 'price', w2: 'value',
  b1: 'Does your content', b2: 'show', b3: 'it?',
  c1: "Let's make it", c2: 'pay'
}, cfg.text || {});

/* ---------------- utils ---------------- */
const cl = x => Math.max(0, Math.min(1, x));
const P = (F, a, b) => cl((F - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eOut3 = t => 1 - Math.pow(1 - t, 3);
const eIn3 = t => t * t * t;
const eIO3 = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eOutBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
function rnd(seed) { let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
/* piecewise keyframes [[F, v...], ...] with easing per segment (default easeInOut) */
function kf(keys, F, ease = eIO3) {
  if (F <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (F <= b[0]) { const t = ease((F - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], t)); }
  }
  return keys[keys.length - 1].slice(1);
}
/* Catmull-Rom through [[F,x,y],...] */
function crPath(keys, F) {
  if (F <= keys[0][0]) return [keys[0][1], keys[0][2]];
  if (F >= keys[keys.length - 1][0]) { const k = keys[keys.length - 1]; return [k[1], k[2]]; }
  let i = 0; while (keys[i + 1][0] < F) i++;
  const p0 = keys[Math.max(0, i - 1)], p1 = keys[i], p2 = keys[i + 1], p3 = keys[Math.min(keys.length - 1, i + 2)];
  const t = (F - p1[0]) / (p2[0] - p1[0]), t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return [f(p0[1], p1[1], p2[1], p3[1]), f(p0[2], p1[2], p2[2], p3[2])];
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function layer() { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return [c, c.getContext('2d')]; }

/* camera: screen = s*world + t (source px) */
function cam(F) { const c = CAM[F]; return c ? { s: c[0], tx: c[1], ty: c[2] } : { s: 1, tx: 0, ty: 0 }; }
function setWorld(g, c) { g.setTransform(K * c.s, 0, 0, K * c.s, K * c.tx, K * c.ty); }
function setScreen(g) { g.setTransform(K, 0, 0, K, 0, 0); }

/* ---------------- primitives ---------------- */
function fontStr(w, size, fam = SANS) { return `${w} ${size}px ${fam}`; }
function measure(g, str, font, ls) { g.font = font; g.letterSpacing = ls + 'px'; return g.measureText(str).width - ls; }
function drawText(g, str, x, y, o = {}) {
  g.save();
  g.font = o.font; g.letterSpacing = (o.ls || 0) + 'px';
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let w = g.measureText(str).width - (o.ls || 0);
  if (o.align === 'center') x -= w / 2; else if (o.align === 'right') x -= w;
  g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.blur) g.filter = `blur(${o.blur * K}px)`;
  if (o.glow) { g.shadowColor = o.glowColor || Y; g.shadowBlur = o.glow * K; }
  g.fillStyle = typeof o.fill === 'function' ? o.fill(g, x, y, w) : (o.fill || '#fff');
  g.fillText(str, x, y);
  if (o.stroke) { g.lineWidth = o.stroke; g.strokeStyle = g.fillStyle; g.strokeText(str, x, y); }
  g.restore();
  return w;
}
/* horizontal motion smear: draws fn(dx) several times with alpha falloff */
function smear(g, amount, n, fn) {
  if (Math.abs(amount) < 0.5) { fn(0, 1); return; }
  for (let i = n - 1; i >= 0; i--) { const t = i / (n - 1); g.save(); g.globalAlpha *= (i === 0 ? 1 : 0.55 * (1 - t) / 1); fn(-amount * t, i === 0 ? 1 : 0.5); g.restore(); }
}
function silver(g, x, y, w) { const gr = g.createLinearGradient(0, y - 75, 0, y + 25); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.45, '#e9e9e9'); gr.addColorStop(0.8, '#a9a9a9'); gr.addColorStop(1, '#7e7e7e'); return gr; }
function cross(g, x, y, L, w, ang, sc = 1, alpha = 1) {
  if (sc <= 0.001 || alpha <= 0) return;
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(sc, sc); g.globalAlpha *= alpha;
  g.strokeStyle = Y; g.lineCap = 'round'; g.lineWidth = w;
  g.beginPath(); g.moveTo(-L / 2 + w / 2, 0); g.lineTo(L / 2 - w / 2, 0); g.moveTo(0, -L / 2 + w / 2); g.lineTo(0, L / 2 - w / 2); g.stroke();
  g.restore();
}
function rrect(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function plane(g, x, y, ang, sz, alpha = 1) {
  if (alpha <= 0) return;
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(sz / 26, sz / 26); g.globalAlpha *= alpha;
  g.fillStyle = '#fff'; g.shadowColor = 'rgba(255,255,255,0.6)'; g.shadowBlur = 6 * K;
  g.beginPath(); g.moveTo(14, 0); g.lineTo(-12, -11); g.lineTo(-6, 0); g.lineTo(-12, 11); g.closePath(); g.fill();
  g.restore();
}
function badge(g, x, y, r, sc, checkA = 1, morphDot = 0) {
  if (sc <= 0) return;
  g.save(); g.translate(x, y); g.scale(sc, sc);
  g.fillStyle = '#f4f4f4'; g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 4 * K;
  g.beginPath();
  const n = 9;
  for (let i = 0; i <= 72; i++) { const a = i / 72 * Math.PI * 2; const rr = r * (1 + (1 - morphDot) * 0.09 * Math.cos(a * n)); const px = Math.cos(a) * rr, py = Math.sin(a) * rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.fill(); g.shadowBlur = 0;
  if (checkA > 0) { g.globalAlpha *= checkA; g.strokeStyle = '#3a3a3a'; g.lineWidth = r * 0.17; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-r * .38, r * .02); g.lineTo(-r * .1, r * .3); g.lineTo(r * .4, -r * .26); g.stroke(); }
  g.restore();
}

/* ---------------- background ---------------- */
function drawBG(g, F) {
  const c = cam(F); setWorld(g, c);
  g.drawImage(BG, -120, -120, 960, 1520);
}

/* ---------------- character ---------------- */
function drawShadow(g, F) {
  const img = CUT[F]; if (!img) return; const c = cam(F);
  const fy = c.s * 995 + c.ty, fx = c.s * 372 + c.tx;
  const [lc, lg] = layer();
  lg.setTransform(K, 0, 0, K, 0, 0);
  lg.translate(fx, fy); lg.transform(1.25, 0, 0.35, -0.3, 0, 0); lg.translate(-fx, -fy);
  lg.filter = `blur(${5 * K}px)`;
  lg.drawImage(img, 0, 0, W, H);
  lg.globalCompositeOperation = 'source-in'; lg.filter = 'none'; lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.fillStyle = '#000'; lg.fillRect(0, 0, cv.width, cv.height);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 0.88; g.drawImage(lc, 0, 0); g.restore();
}
function drawChar(g, F) { const img = CUT[F]; if (!img) return; setScreen(g); g.drawImage(img, 0, 0, W, H); }

/* =====================================================================
   SCENE A  (F1 - F138): "You're not competing on price." -> "value."
   ===================================================================== */
const CARD_KEYS = [ // F, x, y, w, h, r   (world)
  [1, 152, 140, 416, 640, 56], [88, 152, 140, 416, 640, 56], [92, 236, 124, 301, 398, 52], [94, 283, 112, 185, 140, 46],
  [96, 313, 104, 103, 77, 38], [98, 298, 104, 140, 118, 44], [100, 290, 106, 152, 150, 44], [102, 285, 107, 160, 160, 45], [104, 287, 108, 156, 156, 44]];
const COMET = [[3, 790, 175], [4, 665, 195], [5, 600, 214], [6, 552, 230], [7, 492, 241], [8, 418, 255], [9, 330, 263], [10, 245, 262], [11, 180, 245],
  [12, 125, 230], [13, 92, 219], [14, 74, 211], [15, 61, 206], [16, 52, 207], [17, 46, 214], [18, 44, 228], [19, 48, 244], [20, 56, 260],
  [21, 68, 276], [22, 92, 300], [23, 148, 333], [24, 200, 348], [25, 238, 350], [26, 256, 345], [27, 262, 342]];
const PLANE = [[35, 528, 322], [37, 540, 300], [41, 584, 226], [47, 600, 166], [55, 576, 124], [63, 540, 117], [71, 495, 126], [77, 437, 149], [80, 421, 160], [91, 421, 160], [96, 390, 214]];
const PLANE2 = [[98, 360, 200], [99, 345, 210], [101, 300, 249], [103, 240, 285], [104, 180, 318], [105, 120, 348], [106, 30, 393], [107, -40, 425]];

function sceneA_back(g, F) {
  const c = cam(F); setWorld(g, c);
  /* ---- glass card -> squircle ---- */
  let [x, y, w, h, r] = kf(CARD_KEYS, F);
  const intro = eOut3(P(F, 1.5, 6));
  const solid = P(F, 92, 100);
  g.save();
  if (F < 7) { const sc = lerp(1.1, 1, intro); g.translate(360, 460); g.scale(sc, sc); g.translate(-360, -460); }
  g.globalAlpha = intro;
  // soft drop glow
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 18 * K * c.s;
  rrect(g, x, y, w, h, r);
  const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, `rgba(${lerp(255, 96, solid)},${lerp(255, 96, solid)},${lerp(255, 96, solid)},${lerp(0.085, 1, solid)})`);
  gr.addColorStop(1, `rgba(${lerp(255, 58, solid)},${lerp(255, 58, solid)},${lerp(255, 58, solid)},${lerp(0.03, 1, solid)})`);
  g.fillStyle = gr; g.fill(); g.shadowBlur = 0;
  // outer dark ring (squircle) + light rim
  if (solid > 0) { g.lineWidth = 5; g.strokeStyle = `rgba(0,0,0,${0.55 * solid})`; rrect(g, x - 3, y - 3, w + 6, h + 6, r + 3); g.stroke(); }
  rrect(g, x + 1, y + 1, w - 2, h - 2, r - 1); g.lineWidth = 2;
  const rim = g.createLinearGradient(0, y, 0, y + h); rim.addColorStop(0, `rgba(255,255,255,${lerp(0.22, 0.42, solid)})`); rim.addColorStop(0.5, `rgba(255,255,255,${lerp(0.08, 0.18, solid)})`); rim.addColorStop(1, `rgba(255,255,255,${lerp(0.14, 0.3, solid)})`);
  g.strokeStyle = rim; g.stroke();
  // inner top sheen
  const sh = g.createLinearGradient(0, y, 0, y + Math.min(h, 160)); sh.addColorStop(0, `rgba(255,255,255,${0.10 + 0.08 * solid})`); sh.addColorStop(1, 'rgba(255,255,255,0)');
  rrect(g, x + 3, y + 3, w - 6, Math.min(h, 160), r - 3); g.fillStyle = sh; g.fill();
  g.restore();
  /* ---- pill (notch) ---- */
  const pillA = intro * (1 - P(F, 89, 92));
  if (pillA > 0) {
    const pw = lerp(90, 66, eIO3(P(F, 80, 86)));
    g.save(); g.globalAlpha = pillA; g.fillStyle = '#fff'; g.shadowColor = 'rgba(255,255,255,0.7)'; g.shadowBlur = 8 * K;
    const sc = F < 89 ? 1 : lerp(1, 0.3, P(F, 89, 92));
    rrect(g, 405 - pw * sc, 172, pw * sc, 20 * sc, 10 * sc); g.fill(); g.restore();
  }
  /* ---- loader squares ---- */
  for (let i = 0; i < 5; i++) {
    const tin = 7.5 + i * 1.6, tout = 22 + i * 1.5;
    const sIn = eOutBack(P(F, tin, tin + 2.5), 2.2), sOut = 1 - eIn3(P(F, tout, tout + 2.5));
    const sc = Math.min(sIn, sOut); if (sc <= 0.01) continue;
    const hpos = (F - 15.5) / 1.4;
    const hi = F < 15 ? (F - tin < 1.5 ? 1 : 0.0) : Math.max(0, 1 - Math.abs(i - hpos) * 0.9);
    const a = 0.5 + 0.5 * hi;
    const cx = 231 + 24 + i * 53.75, cy = 458;
    g.save(); g.translate(cx, cy); g.scale(sc, sc);
    g.fillStyle = `rgba(${YRGB},${a})`; if (hi > 0.3) { g.shadowColor = Y; g.shadowBlur = 10 * K * hi; }
    rrect(g, -24, -24, 48, 48, 7); g.fill(); g.restore();
  }
  /* ---- line 1: "You're not" -> "You're" ---- */
  drawLine1(g, F);
  /* ---- "competing" + "on" ---- */
  drawCompeting(g, F);
  /* ---- "price." -> "value." ---- */
  drawBigWord(g, F);
  /* ---- hand-drawn ring around the statement ---- */
  drawRing(g, F);
}

function letterLayout(g, str, font, ls) { g.font = font; g.letterSpacing = ls + 'px'; const xs = []; for (let i = 0; i < str.length; i++) xs.push(g.measureText(str.slice(0, i)).width); return xs; }
function drawLine1(g, F) {
  const font = fontStr(400, 44, SANS), ls = -2.2;
  const exitP = P(F, 122, 129);
  if (exitP >= 1) return;
  if (F < 91) {
    const str = TXT.a1;
    const tot = measure(g, str, font, ls), x0 = 352 - tot / 2;
    const xs = letterLayout(g, str, font, ls);
    for (let i = 0; i < str.length; i++) {
      const tr = 10.6 + (str.length - 1 - i) / (str.length - 1) * 5.2;   // comet writes right -> left
      const p = P(F, tr, tr + 3); if (p <= 0) continue;
      const e = eOut3(p);
      g.save();
      const lx = x0 + xs[i] + (1 - e) * (i - str.length / 2) * 6, ly = 320 - (1 - e) * 8;
      g.translate(lx, ly); g.scale(lerp(1.5, 1, e), lerp(1.5, 1, e));
      drawText(g, str[i], 0, 0, { font, ls: 0, alpha: e, blur: (1 - e) * 3 });
      g.restore();
    }
    return;
  }
  // glitch swap F91-F97
  const gp = P(F, 91, 97);
  if (gp < 1) {
    const bands = 6;
    for (let b = 0; b < bands; b++) {
      const seed = Math.floor(F * 2) * 13 + b;
      const showNew = rnd(seed) < gp;
      const str = showNew ? TXT.a1b : TXT.a1;
      const cx = showNew ? 397 : 352;
      const off = (rnd(seed + 5) - 0.5) * 40 * Math.sin(gp * Math.PI);
      g.save(); g.beginPath(); g.rect(0, 280 + b * 8, 720, 8); g.clip();
      drawText(g, str, cx + off, 320, { font, ls, align: 'center', alpha: 0.95 });
      g.restore();
    }
    if (rnd(F * 7) > 0.5) drawText(g, TXT.a1, 352 + (rnd(F) - .5) * 30, 320, { font, ls, align: 'center', alpha: 0.25 * (1 - gp) });
    return;
  }
  exitText(g, TXT.a1b, 397, 320, font, ls, exitP, 'center');
}
/* exit: slide right with a yellow light smear */
function exitText(g, str, x, y, font, ls, p, align, extraW = 0) {
  const e = p * p;
  const dx = 430 * e, alpha = 1 - eIn3(P(p, 0.75, 1));
  const tint = cl(p * 1.8);
  const col = `rgb(${lerp(255, YRGB[0], tint)},${lerp(255, YRGB[1], tint)},${lerp(255, YRGB[2], tint)})`;
  smear(g, 45 * p, 5, (o) => {
    g.save(); g.translate(x + dx + o, y); g.scale(1 + 0.45 * e, 1);
    drawText(g, str, 0, 0, { font, ls, align, fill: col, alpha, glow: 18 * tint });
    g.restore();
  });
}
function drawCompeting(g, F) {
  const sfont = `${cfg.scriptSize || 92}px Script`;
  const shift = 17 * eIO3(P(F, 92, 98));
  const x = 228 + shift, y = 368;
  const exitP = P(F, 125, 135);
  if (exitP >= 1) return;
  const wp = P(F, 27.5, 35);                       // handwriting write-on
  if (wp <= 0) return;
  const cw = measure(g, TXT.script, sfont, 0);
  const onFont = fontStr(400, 40, SANS);
  if (exitP > 0) {
    exitText(g, TXT.script, x, y, sfont, 0, exitP, 'left');
    exitText(g, TXT.on, x + cw + 8, y, onFont, -1.6, exitP, 'left');
    return;
  }
  g.save();
  g.beginPath(); g.rect(x - 30, y - 90, (cw + 40) * eOut3(wp) * 0.6 + (cw + 40) * wp * 0.4 + 10, 160); g.clip();
  const glow = 14 * (1 - P(F, 32, 38));
  drawText(g, TXT.script, x, y, { font: sfont, fill: '#f6ee3e', glow, stroke: 0.45 });
  g.restore();
  if (wp > 0 && wp < 1) {      // bloom at the pen tip
    const hx = x + (cw + 40) * (eOut3(wp) * 0.6 + wp * 0.4) - 20; const rg = g.createRadialGradient(hx, y - 18, 0, hx, y - 18, 40);
    rg.addColorStop(0, 'rgba(253,251,61,0.55)'); rg.addColorStop(1, 'rgba(253,251,61,0)'); g.fillStyle = rg; g.fillRect(hx - 40, y - 60, 80, 90);
  }
  const op = P(F, 32.5, 36.5);
  if (op > 0) {
    const tint = 1 - P(F, 36, 41);
    const col = `rgb(255,255,${lerp(255, 61, tint)})`;
    drawText(g, TXT.on, x + cw + 8, y, { font: onFont, ls: -1.6, alpha: eOut3(op), fill: col, glow: 10 * tint, blur: (1 - op) * 3 });
  }
}
function bigWord(g, str, x, y, o = {}) {
  const font = fontStr(700, cfg.bigSize || 132, SANS), ls = -6.5;
  if (o.cx != null) x = o.cx - (measure(g, str, font, ls) + 24) / 2;
  const w = drawText(g, str, x, y, { font, ls, fill: silver, alpha: o.alpha, blur: o.blur });
  drawText(g, '.', x + w - 4, y, { font, ls: 0, fill: Y, alpha: o.alpha, blur: o.blur });
  return w;
}
function drawBigWord(g, F) {
  // "price." slides in from the left (F26-F31), shrinks out (F92-F96)
  if (F >= 26 && F < 97) {
    const p = P(F, 26, 31.5), e = eOut3(p);
    const dx = -230 * (1 - e);
    const outP = P(F, 92, 96.5), oe = eIn3(outP);
    g.save();
    if (outP > 0) { g.translate(362, 455); g.scale(lerp(1, 0.55, oe), lerp(1, 0.55, oe)); g.translate(-362, -455 + 40 * oe); }
    smear(g, p < 1 ? 120 * (1 - e) : 0, 8, (o) => bigWord(g, TXT.w1, 0, 478, { cx: 362 + dx + o, alpha: cl(p * 2.5) * (1 - outP * 0.4), blur: 4 * oe }));
    g.restore();
  }
  // "value." pops in big and settles (F96.5-F101)
  if (F >= 96.5) {
    const p = P(F, 96.5, 101.5), e = eOutBack(p, 1.3);
    const sc = lerp(1.38, 1, e);
    g.save(); g.translate(355, 445); g.scale(sc, sc); g.translate(-355, -445);
    bigWord(g, TXT.w2, 0, 477, { cx: 366, alpha: cl(p * 3), blur: 7 * (1 - cl(p * 1.6)) });
    g.restore();
  }
}
function drawRing(g, F) {
  if (F < 95 || F > 121) return;
  const draw = eOut3(P(F, 95, 99.5));
  const [rx, ry] = kf([[95, 128, 92], [100, 140, 158], [104, 205, 224], [112, 246, 222], [121, 262, 230]], F, t => t);
  const bright = 1 - P(F, 98.5, 102.5);
  const alpha = (0.55 + 0.4 * bright) * (1 - P(F, 108, 121));
  const cx = 356, cy = 381;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = `rgba(${lerp(150, 253, bright)},${lerp(148, 251, bright)},${lerp(40, 61, bright)},${alpha})`;
  g.lineWidth = lerp(3.5, 5.5, bright);
  if (bright > 0.2) { g.shadowColor = Y; g.shadowBlur = 8 * K * bright; }
  g.beginPath();
  const a0 = -0.6, span = (Math.PI * 2 + 0.35) * draw, N = 120;
  for (let i = 0; i <= N; i++) {
    const a = a0 + span * i / N;
    const wob = 1 + 0.06 * Math.sin(3 * a + 0.7 + F * 0.03) + 0.04 * Math.sin(5 * a + 2.1) + 0.025 * Math.sin(2 * a + 1) + 0.02 * (i / N);
    const px = cx + Math.cos(a) * rx * wob, py = cy + Math.sin(a) * ry * wob;

}
function sceneA_front(g, F) {
  const c = cam(F);
  /* crosses (world) */
  setWorld(g, c);
  const outS = 1 - eIn3(P(F, 89, 95));
  // crosses snap-rotate by 45deg (X <-> +) at fixed beats
  const SNAPS = [11, 26, 50, 65, 83];
  const base = (ph) => { let a = Math.PI / 4; for (const t of SNAPS) a += (Math.PI / 4) * eIO3(P(F, t + ph, t + ph + 4)); return a; };
  // big cross flies in from the right
  { const p = eOut3(P(F, 2.5, 7.5)); const x = lerp(820, 568, p), y = lerp(330, 418, p);
    cross(g, x, y, 92, 19, base(0) + (1 - p) * 3, Math.min(1, P(F, 2.5, 4)) * outS); }
  { const p = eOut3(P(F, 1.5, 6.5)); cross(g, lerp(40, 155, p), lerp(200, 285, p), 44, 9, base(9) + (1 - p) * 4, P(F, 1.5, 3) * outS); }
  { const p = eOut3(P(F, 1, 6)); cross(g, lerp(60, 215, p), lerp(680, 562, p), 22, 4.5, base(17) + (1 - p) * 4, P(F, 1, 2.5) * outS); }
  /* paper plane (world) */
  if (F >= 35 && F < 97) {
    const [px, py] = crPath(PLANE, F); const [qx, qy] = crPath(PLANE, F + 0.6);
    let ang = Math.atan2(qy - py, qx - px); if (F >= 79) ang = lerp(Math.PI * 0.98, Math.PI * 0.75, P(F, 91, 96));
    const sc = eOutBack(P(F, 35, 38.5)) * (1 - P(F, 94, 97) * 0.6);
    plane(g, px, py, ang, 34 * sc, 1);
  }
  /* badge on the squircle */
  if (F >= 96) {
    const sc = eOutBack(P(F, 96, 99.5), 2.2) * lerp(1, 0.62, eIO3(P(F, 135.5, 138)));
    badge(g, 393, 216, 20, sc, 1 - P(F, 135, 137), P(F, 135.5, 137.5));
  }
  /* screen-space comet + exiting plane */
  setScreen(g);
  if (F >= 3 && F <= 28) comet(g, F);
  if (F >= 21 && F <= 28) { const p = P(F, 21, 28); const hx = lerp(150, -60, eIn3(p)); streak(g, hx, 447, 70 * (0.3 + p), 4, 1); }
  if (F >= 98 && F <= 107) { const [px, py] = crPath(PLANE2, F); const [qx, qy] = crPath(PLANE2, F + 0.5); plane(g, px, py, Math.atan2(qy - py, qx - px), 24, 1 - P(F, 106, 107)); }
}
function comet(g, F) {
  const fade = 1 - P(F, 25.5, 28);
  const trail = 26, step = 0.22;
  const pts = []; for (let i = 0; i < trail; i++) { const f = F - i * step; if (f < 3) break; pts.push(crPath(COMET, f)); }
  if (pts.length < 2) return;
  g.save(); g.lineCap = 'round'; g.shadowColor = 'rgba(255,255,255,0.8)'; g.shadowBlur = 6 * K;
  for (let i = 0; i < pts.length - 1; i++) {
    const t = i / (pts.length - 1);
    g.strokeStyle = `rgba(255,255,255,${fade * (1 - t) ** 0.8})`; g.lineWidth = 8 * (1 - t) ** 1.2 + 0.4;
    g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i + 1][0], pts[i + 1][1]); g.stroke();

}
function streak(g, x, y, len, w, a) {
  const gr = g.createLinearGradient(x, 0, x + len, 0); gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.save(); g.fillStyle = gr; g.beginPath(); g.ellipse(x + len / 2, y, len / 2, w / 2, 0, 0, Math.PI * 2); g.fill(); g.restore();
}

/* =====================================================================
   SCENE B (F139 - F179): "Does your content SHOW it?"  (screen space)
   ===================================================================== */
function sceneB(g, F) {
  setScreen(g);
  // backdrop: black, soft lighter field, dot grid
  g.fillStyle = '#050505'; g.fillRect(0, 0, W, H);
  let rg = g.createRadialGradient(310, 600, 0, 310, 600, 560); rg.addColorStop(0, 'rgba(46,46,40,1)'); rg.addColorStop(0.55, 'rgba(22,22,20,1)'); rg.addColorStop(1, 'rgba(5,5,5,1)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(120,120,120,0.55)';
  for (let ix = 0; ix < 5; ix++) for (let iy = 0; iy < 10; iy++) { g.beginPath(); g.arc(37 + ix * 160.5, 37 + iy * 133.7, 1.5, 0, Math.PI * 2); g.fill(); }
  // group transform: whip in from the left, slow drift, blur-out
  const pin = P(F, 138.5, 150), ein = eOutExpo(pin);
  const dx = kf([[138.5, -300], [141, -160], [144, -92], [149, -55], [154, -38], [164, -8], [170, 0], [179, 8]], F, eOut3)[0];
  const out = P(F, 174, 179.5);
  const sc = lerp(1.0, 0.975, P(F, 150, 174)) * lerp(1, 0.9, eIn3(out));
  const blur = 7 * (1 - cl(pin * 2.2)) + 7 * eIn3(out);
  const smearAmt = 140 * (1 - eOutExpo(cl(pin * 1.4)));
  const [lc, lg] = layer(); lg.setTransform(K, 0, 0, K, 0, 0);
  lg.translate(340, 600); lg.scale(sc, sc); lg.translate(-340 + dx, -600);
  // yellow glow field behind the word
  const gl = lg.createRadialGradient(440, 615, 0, 440, 615, 270); gl.addColorStop(0, `rgba(253,251,61,${0.10 + 0.12 * out})`); gl.addColorStop(1, 'rgba(253,251,61,0)');
  lg.fillStyle = gl; lg.fillRect(0, 200, 800, 800);
  smear(lg, smearAmt, 9, (o) => {
    lg.save(); lg.translate(o, 0);
    drawText(lg, TXT.b1, 113, 502, { font: fontStr(500, 46, SANS), ls: -2.4 });
    const sf = fontStr(700, cfg.showSize || 216, SANS);
    const fill = (gg, x, y, w) => { const gr = gg.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.32, '#fbfcf0'); gr.addColorStop(0.6, '#eef04e'); gr.addColorStop(0.85, '#f1f3a0'); gr.addColorStop(1, '#f4f5d8'); return gr; };
    // glow pass then crisp pass
    const gfill = (gg, x, y, w) => { const gr = gg.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, 'rgba(253,251,61,0)'); gr.addColorStop(0.45, 'rgba(253,251,61,0.6)'); gr.addColorStop(1, 'rgba(253,251,61,0.9)'); return gr; };
    drawText(lg, TXT.b2, 92, 665, { font: sf, ls: -11, fill: gfill, glow: 22, alpha: 0.5 });
    const bw = drawText(lg, TXT.b2, 92, 665, { font: sf, ls: -11, fill });
    drawText(lg, TXT.b3, 92 + bw - 94, 712, { font: fontStr(500, 36, SANS), ls: -1.5 });
    lg.restore();
  });
  // arcs (rotate slowly)
  // two corner "bracket" arcs, point-symmetric about the word
  const rot = (P(F, 139, 179) * 8 - 4) * Math.PI / 180;
  lg.save(); lg.translate(345, 590); lg.rotate(rot); lg.strokeStyle = '#fff'; lg.lineWidth = 13; lg.lineCap = 'round';
  const ap = eOut3(P(F, 139, 147)), D2R = Math.PI / 180;
  lg.beginPath(); lg.arc(185, -65, 91, -95 * D2R, (-95 + 76 * ap) * D2R); lg.stroke();
  lg.beginPath(); lg.arc(-185, 65, 91, 85 * D2R, (85 + 76 * ap) * D2R); lg.stroke();
  lg.restore();
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); if (blur > 0.2) g.filter = `blur(${blur * K}px)`; g.drawImage(lc, 0, 0); g.restore();
}

/* =====================================================================
   SCENE C (F180 - F223): "Let's make it pay."  (world, behind character)
   ===================================================================== */
const BUBBLES = [ // final world pos, radius, start offset
  { x: 178, y: 325, r: 21, sx: 640, sy: 420, d: 0 }, { x: 220, y: 287, r: 15, sx: 660, sy: 330, d: 1.5 }, { x: 270, y: 260, r: 8.5, sx: 610, sy: 250, d: 3 }];
function sceneC_back(g, F) {
  const c = cam(F); setWorld(g, c);
  const p = P(F, 181, 197), e = eOut3(p);
  const sc = lerp(1.32, 1, e), blur = 8 * (1 - cl(p * 1.5)), alpha = cl((F - 180.5) / 2.5);
  g.save(); g.translate(360, 420); g.scale(sc, sc); g.translate(-360, -420);
  const lp = eOut3(P(F, 181, 193));
  drawText(g, TXT.c1, 359, 366 - 22 * (1 - lp), { font: fontStr(500, 46, SANS), ls: -2.4, align: 'center', alpha, blur });
  const palpha = cl((F - 183) / 2.5);
  const pf = fontStr(700, cfg.paySize || 176, SANS);
  const fill = (gg, x, y, w) => { const gr = gg.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, '#e2e353'); gr.addColorStop(0.45, '#eef0a6'); gr.addColorStop(1, '#f6f6ea'); return gr; };
  const pw = measure(g, TXT.c2, pf, -9), px0 = 359 - (pw + 34) / 2;
  drawText(g, TXT.c2, px0, 480, { font: pf, ls: -9, fill, alpha: palpha, blur });
  g.beginPath(); g.fillStyle = Y; g.globalAlpha = palpha; if (blur > 0.2) g.filter = `blur(${blur * K}px)`; g.arc(px0 + pw + 12, 458, 15.5, 0, Math.PI * 2); g.fill();
  g.restore();
}
function sceneC_front(g, F) {
  const c = cam(F); setWorld(g, c);
  for (const b of BUBBLES) {
    const p = P(F, 181 + b.d, 194 + b.d);
    if (p <= 0) continue;
    const [ox, oy, osc] = kf([[181 + b.d, 430, 70, 1.7], [190 + b.d, 200, -40, 1.25], [197 + b.d, 95, -45, 1.05], [202 + b.d, 45, -30, 1], [212, 10, -8, 1], [219, 0, 0, 1]], F, eOut3);
    const e = eOut3(p);
    const x = b.x + ox, y = b.y + oy;
    const r = b.r * osc;
    g.save(); g.translate(x, y); g.rotate((1 - e) * 2.5 + F * 0.01);
    if (p < 0.6) g.filter = `blur(${(1 - p / 0.6) * 5 * K}px)`;
    g.strokeStyle = '#fff'; g.lineWidth = b.r > 10 ? 3.2 : 2.6; g.globalAlpha = cl(p * 4);
    g.beginPath();
    for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2; const rr = r * (1 + 0.07 * Math.cos(a * 4 + b.r) + 0.05 * Math.sin(a * 3 + 1)); i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 1.08) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr * 1.08); }
    g.closePath(); g.stroke(); g.restore();
  }
}

/* =====================================================================
   frame entry
   ===================================================================== */
function globalBlur(F) {
  const t = { 1: 9, 2: 7, 3: 4.5, 4: 3, 5: 2, 6: 1.2, 7: 0.6, 136: 1.8, 137: 4, 138: 6.5,
    180: 9, 181: 8, 182: 7, 183: 5.5, 184: 4.5, 185: 3.5, 186: 2.6, 187: 1.8, 188: 1.1, 189: 0.6 };
  return t[F] || 0;
}
window.renderFrame = async function (F) {
  if (F >= 139 && F <= 179) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); sceneB(ctx, F); return cv.toDataURL('image/png'); }
  if (!CUT[F]) CUT[F] = await loadImg(`cut/c${String(F).padStart(3, '0')}.png`);
  const [bl, bg] = layer(); // everything behind the character
  drawBG(bg, F);
  if (F <= 138) sceneA_back(bg, F); else sceneC_back(bg, F);
  const gb = globalBlur(F);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = gb ? `blur(${gb * K}px)` : 'none';
  ctx.drawImage(bl, 0, 0); ctx.filter = 'none';
  drawShadow(ctx, F);
  drawChar(ctx, F);
  const [fl, fg] = layer();
  if (F <= 138) sceneA_front(fg, F); else sceneC_front(fg, F);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = gb ? `blur(${gb * K}px)` : 'none'; ctx.drawImage(fl, 0, 0); ctx.filter = 'none';
  delete CUT[F - 2];
  return cv.toDataURL('image/png');
};
window.init = async function () {
  CAM = await (await fetch('cam.json')).json();
  BG = await loadImg('bg_world.png');
  for (const w of [400, 500, 700]) await document.fonts.load(`${w} 40px InterD`);
  await document.fonts.load(`80px Script`);
  return document.fonts.check(`80px Script`) && document.fonts.check(`700 100px InterD`);
};
