<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../engine/style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
body.bg{background:var(--thumb-bg,#e6e7eb)}
.card{position:absolute;left:90px;top:300px;width:900px;height:1220px;border-radius:72px;background:#fff;
  box-shadow:0 50px 90px -50px rgba(37,50,90,.45),0 2px 4px rgba(37,50,90,.05);font-family:var(--sans);color:var(--ink)}
.tag{position:absolute;left:80px;top:78px;font-size:30px;font-weight:700;letter-spacing:.22em;color:var(--green)}
.seven{position:relative;display:inline-block}.seven img{position:absolute;left:-30px;top:-38px;width:105px;height:105px;opacity:.92;mix-blend-mode:multiply;pointer-events:none}
.num{position:absolute;right:80px;top:70px;font-size:30px;font-weight:800;color:#fff;background:var(--blue);border-radius:999px;padding:8px 22px;letter-spacing:.02em}
h1{position:absolute;left:76px;top:150px;margin:0;font-size:150px;line-height:.92;font-weight:850;letter-spacing:-.055em}
h1 span{color:var(--blue)}
.sub{position:absolute;left:80px;top:420px;font-size:46px;font-weight:600;letter-spacing:-.02em;color:var(--body)}
.sub b{color:var(--ink)}
.fan{position:absolute;left:0;right:0;top:560px;height:420px}
.c{position:absolute;top:0;width:250px;height:330px;border-radius:40px;padding:30px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 30px 50px -30px rgba(37,50,90,.5);font-weight:800;font-size:44px;letter-spacing:-.03em}
.c span{font-size:24px;font-weight:600;opacity:.75}
.c.b{background:var(--blue);color:#fff;left:70px;transform:rotate(-9deg) translateY(40px)}
.c.g{background:var(--lime);color:#fff;left:250px;transform:rotate(-3deg) translateY(10px)}
.c.k{background:var(--ink);color:#fff;left:430px;transform:rotate(3deg) translateY(10px)}
.c.p{background:#eef0f5;color:var(--ink);left:600px;transform:rotate(9deg) translateY(40px)}
.dots{position:absolute;left:80px;top:1010px;display:flex;gap:12px;align-items:center}
.dots i{display:block;width:16px;height:16px;border-radius:8px;background:var(--line)}
.dots i.on{width:48px;background:var(--blue)}
.swipe{position:absolute;left:80px;top:1070px;font-size:40px;font-weight:700;color:var(--blue);letter-spacing:-.01em}
</style></head><body class="BG">
<div class="card">
  <div class="tag">AKTUALITA · <span class="seven">7.<img src="../coldopen/v2/hook/coffee_ms/mark.png"></span> ŘÍJNA</div>
  <div class="num">#1</div>
  <h1>Karusely<br><span>v Edits</span></h1>
  <div class="sub">Appka od Instagramu, <b>zdarma</b></div>
  <div class="fan">
    <div class="c b"><span>01</span>Fotky</div>
    <div class="c g"><span>02</span>Videa</div>
    <div class="c k"><span>03</span>Texty</div>
    <div class="c p"><span>04</span>Efekty</div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
  <div class="swipe">Swipni →</div>
</div>
</body></html>
