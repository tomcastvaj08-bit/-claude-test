<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../engine/style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.card{position:absolute;left:90px;top:300px;width:900px;height:1220px;border-radius:72px;background:#fff;box-shadow:0 50px 90px -50px rgba(37,50,90,.45);font-family:var(--sans);color:var(--ink)}
.tag{position:absolute;left:80px;top:78px;font-size:30px;font-weight:700;letter-spacing:.22em;color:var(--green)}
.day{position:relative;display:inline-block}.day img{position:absolute;left:-28px;top:-34px;width:110px;height:110px;opacity:.9;mix-blend-mode:multiply}
.num{position:absolute;right:80px;top:70px;font-size:30px;font-weight:800;color:#fff;background:var(--blue);border-radius:999px;padding:8px 22px}
h1{position:absolute;left:76px;top:150px;margin:0;font-size:138px;line-height:.92;font-weight:850;letter-spacing:-.055em;white-space:nowrap}
h1 span{color:var(--blue)}
.sub{position:absolute;left:80px;top:420px;font-size:42px;font-weight:600;letter-spacing:-.02em;color:var(--body)}
.sub b{color:var(--ink)}
.win{position:absolute;left:80px;top:540px;width:520px;height:360px;border-radius:24px;background:#fff;border:2px solid var(--line);box-shadow:0 30px 60px -30px rgba(37,50,90,.5);overflow:hidden;transform:rotate(-4deg)}
.bar{height:42px;background:#f1f3f8;display:flex;gap:8px;align-items:center;padding:0 14px;border-bottom:1px solid var(--line)}
.bar i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar b{margin-left:auto;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4b82f3,#7b5cf0);color:#fff;font-size:18px;font-weight:850;display:grid;place-items:center}
.pg{padding:24px 30px}.pg .h{height:24px;width:70%;border-radius:8px;background:var(--ink);margin-bottom:16px}.pg .im{height:110px;border-radius:14px;background:linear-gradient(135deg,#dfe8fb,#eae3fb)}
.pg i{display:block;height:12px;border-radius:6px;background:#e3e7ef;margin-top:12px}
.sl{position:absolute;width:300px;height:200px;border-radius:20px;background:#fff;border:2px solid #eef0f5;box-shadow:0 30px 50px -26px rgba(37,50,90,.55);padding:22px;box-sizing:border-box;font-weight:800;font-size:26px;letter-spacing:-.03em}
.sl.c{background:linear-gradient(135deg,#4b82f3,#7b5cf0);color:#fff;display:flex;align-items:flex-end}
.ch{display:flex;align-items:flex-end;gap:12px;height:110px;margin-top:14px}.ch i{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--blue-2),var(--blue))}.ch i:last-child{background:linear-gradient(180deg,#8ee067,var(--green))}
.arrow{position:absolute;left:520px;top:640px;font-size:90px;font-weight:850;color:var(--blue)}
.verbs{position:absolute;left:80px;top:1090px;font-size:40px;font-weight:700;color:var(--blue)}
.verbs em{font-style:normal;color:var(--muted);font-weight:600}
</style></head><body>
<div class="card">
  <div class="tag">AKTUALITA · <span class="day">31.<img src="../../../assets/coldopen/v2/hook/hl_ms/mark.png"></span> ŘÍJNA</div>
  <div class="num">#4</div>
  <h1>Web na<br><span>prezentaci</span></h1>
  <div class="sub">Presentations.AI · Chrome · <b>zdarma</b></div>
  <div class="win"><div class="bar"><i></i><i></i><i></i><b>P</b></div><div class="pg"><div class="h"></div><div class="im"></div><i style="width:94%"></i><i style="width:80%"></i></div></div>
  <div class="verbs">1 klik <em>·</em> slajdy <em>·</em> hotovo →</div>
</div>
<div class="sl c" style="left:620px;top:1060px;transform:rotate(8deg)">Kavárna U Mlýna</div>
<div class="sl" style="left:700px;top:1250px;transform:rotate(-6deg)">Tržby 2026<div class="ch"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i></div></div>
<div class="sl" style="left:560px;top:1380px;transform:rotate(4deg)">Co nabízíme<div style="font-size:20px;font-weight:600;color:var(--body);margin-top:14px;line-height:1.6">• Výběrová káva<br>• Domácí dorty</div></div>
</body></html>
