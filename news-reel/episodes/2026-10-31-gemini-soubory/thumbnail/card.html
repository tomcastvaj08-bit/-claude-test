<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../engine/style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.card{position:absolute;left:90px;top:300px;width:900px;height:1220px;border-radius:72px;background:#fff;
  box-shadow:0 50px 90px -50px rgba(37,50,90,.45),0 2px 4px rgba(37,50,90,.05);font-family:var(--sans);color:var(--ink)}
.tag{position:absolute;left:80px;top:78px;font-size:30px;font-weight:700;letter-spacing:.22em;color:var(--green)}
.day{position:relative;display:inline-block}.day img{position:absolute;left:-10px;top:-30px;width:96px;height:96px;opacity:.95;mix-blend-mode:multiply;pointer-events:none}
.num{position:absolute;right:80px;top:70px;font-size:30px;font-weight:800;color:#fff;background:var(--blue);border-radius:999px;padding:8px 22px;letter-spacing:.02em}
h1{position:absolute;left:76px;top:150px;margin:0;font-size:124px;white-space:nowrap;line-height:.92;font-weight:850;letter-spacing:-.055em}
h1 span{color:var(--blue)}
.sub{position:absolute;left:80px;top:400px;font-size:42px;font-weight:600;letter-spacing:-.02em;color:var(--body)}
.sub b{color:var(--ink)}
.grid{position:absolute;left:80px;top:540px;width:560px;height:430px;transform:rotate(-5deg)}
.f{position:absolute;width:265px;height:200px;border-radius:26px;background:#fff;box-shadow:0 30px 50px -28px rgba(37,50,90,.55);overflow:hidden;border:2px solid #eef0f5}
.f .b{height:70px;background:var(--c);display:flex;align-items:center;gap:12px;padding:0 20px;color:#fff;font-size:28px;font-weight:800;letter-spacing:-.02em}
.f i{display:block;height:12px;border-radius:6px;background:#e6e9f0;margin:16px 20px 0}
.f i.s{width:45%}
.star{position:absolute;left:600px;top:600px;width:130px;height:130px;filter:drop-shadow(0 18px 30px rgba(145,119,199,.45))}
.verbs{position:absolute;left:80px;top:1080px;font-size:40px;font-weight:700;color:var(--blue);letter-spacing:-.01em}
.verbs em{font-style:normal;color:var(--muted);font-weight:600}
</style></head><body>
<div class="card">
  <div class="tag">AKTUALITA · <span class="day">29.<img src="../../../assets/coldopen/v2/hook/gum_ms/mark.png"></span> ŘÍJNA</div>
  <div class="num">#3</div>
  <h1>Gemini<br><span>dělá soubory</span></h1>
  <div class="sub">Google · přímo v chatu · <b>zdarma</b></div>
  <div class="grid">
    <div class="f" style="left:0;top:0;--c:#4285F4"><div class="b">Dokument</div><i></i><i></i><i class="s"></i></div>
    <div class="f" style="left:290px;top:0;--c:#E5484D"><div class="b">PDF</div><i></i><i></i><i class="s"></i></div>
    <div class="f" style="left:0;top:225px;--c:#F4B400"><div class="b">Prezentace</div><i></i><i></i><i class="s"></i></div>
    <div class="f" style="left:290px;top:225px;--c:#0F9D58"><div class="b">Tabulka</div><i></i><i></i><i class="s"></i></div>
  </div>
  <svg class="star" viewBox="-50 -50 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4796E3"/><stop offset=".55" stop-color="#9177C7"/><stop offset="1" stop-color="#CA6673"/></linearGradient></defs><path d="M0,-46 C3,-14 14,-3 46,0 C14,3 3,14 0,46 C-3,14 -14,3 -46,0 C-14,-3 -3,-14 0,-46Z" fill="url(#g)"/></svg>
  <div class="verbs">Napíšeš <em>·</em> vytvoří <em>·</em> upravíš →</div>
</div>
</body></html>
