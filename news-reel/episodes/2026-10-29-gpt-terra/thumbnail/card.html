<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../engine/style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.card{position:absolute;left:90px;top:300px;width:900px;height:1220px;border-radius:72px;background:#fff;
  box-shadow:0 50px 90px -50px rgba(37,50,90,.45),0 2px 4px rgba(37,50,90,.05);font-family:var(--sans);color:var(--ink)}
.tag{position:absolute;left:80px;top:78px;font-size:30px;font-weight:700;letter-spacing:.22em;color:var(--green)}
.day{position:relative;display:inline-block}.day img{position:absolute;left:-14px;top:-40px;width:110px;height:110px;opacity:.95;mix-blend-mode:multiply;pointer-events:none}
.num{position:absolute;right:80px;top:70px;font-size:30px;font-weight:800;color:#fff;background:var(--blue);border-radius:999px;padding:8px 22px;letter-spacing:.02em}
h1{position:absolute;left:76px;top:150px;margin:0;font-size:150px;line-height:.92;font-weight:850;letter-spacing:-.055em}
h1 span{color:var(--blue)}
.sub{position:absolute;left:80px;top:430px;font-size:46px;font-weight:600;letter-spacing:-.02em;color:var(--body)}
.sub b{color:var(--ink)}
.win{position:absolute;left:80px;top:560px;width:600px;height:400px;border-radius:30px;background:#fff;border:2px solid var(--line);
  box-shadow:0 40px 70px -40px rgba(37,50,90,.55);overflow:hidden;transform:rotate(-4deg)}
.bar{height:44px;background:#f1f3f8;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;padding:0 18px}
.bar i{width:13px;height:13px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.f{position:absolute;left:40px;width:400px;height:54px;border-radius:12px;border:2px solid #dfe3ec;background:#fbfcfe;font-size:24px;font-weight:600;display:flex;align-items:center;padding:0 18px;box-sizing:border-box}
.f.on{border-color:var(--blue);box-shadow:0 0 0 5px rgba(47,107,237,.16)}
.btn{position:absolute;left:40px;top:300px;width:210px;height:62px;border-radius:16px;background:var(--green);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.cur{position:absolute;left:236px;top:334px;width:44px;height:56px}
.cur svg{width:44px;height:56px;fill:var(--ink);stroke:#fff;stroke-width:2.2;stroke-linejoin:round;filter:drop-shadow(0 6px 8px rgba(20,25,40,.3))}
.ai{position:absolute;left:34px;top:42px;padding:3px 10px;border-radius:9px;background:var(--blue);color:#fff;font-size:17px;font-weight:800;font-style:normal}
.ring{position:absolute;left:192px;top:292px;width:90px;height:90px;border-radius:50%;border:4px solid var(--blue);opacity:.5}
.verbs{position:absolute;left:80px;top:1075px;font-size:40px;font-weight:700;color:var(--blue);letter-spacing:-.01em}
.verbs em{font-style:normal;color:var(--muted);font-weight:600}
</style></head><body>
<div class="card">
  <div class="tag">AKTUALITA · <span class="day">27.<img src="../../../assets/coldopen/v2/hook/paint_ms/mark.png"></span> ŘÍJNA</div>
  <div class="num">#2</div>
  <h1>ChatGPT<br><span>ovládá PC</span></h1>
  <div class="sub">GPT-6.1 Terra · <b>na autopilota</b></div>
  <div class="win"><div class="bar"><i></i><i></i><i></i></div>
    <div class="f" style="top:84px">Jana Nováková</div>
    <div class="f" style="top:152px">jana@firma.cz</div>
    <div class="f on" style="top:220px">12 400 Kč</div>
    <div class="btn">Odesláno<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></div>
    <div class="ring"></div>
    <div class="cur"><svg viewBox="0 0 28 36"><path d="M3 2 L3 29 L10 22.5 L14.5 33 L19 31 L14.7 20.8 L24 20.8 Z"/></svg><i class="ai">AI</i></div>
  </div>
  <div class="verbs">Kouká <em>·</em> kliká <em>·</em> píše →</div>
</div>
</body></html>
