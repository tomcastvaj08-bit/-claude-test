<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../engine/style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;background:#0C0F14;overflow:hidden}
.card{position:absolute;left:90px;top:300px;width:900px;height:1220px;border-radius:72px;background:#fff;box-shadow:0 50px 90px -50px rgba(0,0,0,.6);font-family:var(--sans);color:var(--ink);overflow:hidden}
.tag{position:absolute;left:80px;top:78px;font-size:30px;font-weight:700;letter-spacing:.22em;color:var(--green)}
.day{position:relative;display:inline-block}.day:after{content:"";position:absolute;left:-14px;top:-12px;width:66px;height:58px;border:5px solid rgba(206,32,24,.85);border-radius:50%;transform:rotate(-8deg)}
.num{position:absolute;right:80px;top:70px;font-size:30px;font-weight:800;color:#fff;background:var(--blue);border-radius:999px;padding:8px 22px}
h1{position:absolute;left:76px;top:150px;margin:0;font-size:116px;line-height:.95;font-weight:850;letter-spacing:-.055em;white-space:nowrap}
h1 span{background:linear-gradient(90deg,#7b3cff,#2f6bed 60%,#00b3c7);-webkit-background-clip:text;color:transparent}
.sub{position:absolute;left:80px;top:420px;font-size:42px;font-weight:600;letter-spacing:-.02em;color:var(--body)}
.sub b{color:#3d9a17}
.ipad{position:absolute;left:70px;top:560px;width:600px;height:430px;border-radius:44px;background:#121217;transform:rotate(-5deg);box-shadow:0 40px 70px -30px rgba(20,20,60,.6)}
.scr{position:absolute;inset:16px;border-radius:30px;overflow:hidden;background:#f7f3ea}
.tools{position:absolute;left:0;top:0;bottom:0;width:62px;background:#24242c;display:flex;flex-direction:column;gap:10px;padding:14px 10px;box-sizing:border-box}
.tools i{display:block;height:40px;border-radius:10px;background:#3a3a46}.tools i.on{background:linear-gradient(135deg,#7b5cff,#c04cf0)}
.sun{position:absolute;left:330px;top:46px;width:150px;height:150px;border-radius:50%;background:#ff7a2f}
.band{position:absolute;left:62px;top:240px;right:0;height:84px;background:#2b2a7a}
.tri{position:absolute;left:120px;top:110px;width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:150px solid #00b3c7}
.t{position:absolute;left:90px;top:26px;font-weight:900;font-size:44px;line-height:.95;color:#2b2a7a;letter-spacing:-.04em}
.free{position:absolute;left:150px;top:930px;color:#3d9a17;transform:rotate(-10deg);border:8px solid currentColor;border-radius:20px;padding:6px 26px;font-weight:900;font-size:72px;background:#fff}
.verbs{position:absolute;left:80px;top:1120px;font-size:40px;font-weight:700;color:var(--blue)}
.verbs em{font-style:normal;color:var(--muted);font-weight:600}
.stk{position:absolute;left:545px;top:800px;width:520px}
</style></head><body>
<div class="card">
  <div class="tag">AKTUALITA · <span class="day">3.</span> LISTOPADU</div>
  <div class="num">#5</div>
  <h1>Affinity<br><span>na iPad zdarma</span></h1>
  <div class="sub">od Canvy · bez předplatného · <b>0 Kč</b></div>
  <div class="ipad"><div class="scr"><div class="tools"><i></i><i class="on"></i><i></i><i></i><i></i></div><div class="sun"></div><div class="band"></div><div class="tri"></div><div class="t">NOVÁ<br>KOLEKCE</div>
  <svg style="position:absolute;left:0;top:0" width="568" height="398"><path d="M90 360 C 180 280, 280 380, 360 300 S 500 220, 560 180" fill="none" stroke="#c04cf0" stroke-width="10" stroke-linecap="round"/></svg></div></div>
  <div class="free">ZDARMA</div>
  <div class="verbs">fotky <em>·</em> vektory <em>·</em> sazba</div>
</div>
<img class="stk" src="sticker.png">
</body></html>
