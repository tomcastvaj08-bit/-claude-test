<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../domca-identita/engine/style.css">
<style>
  /* Instagram cover 9:16 – všechno důležité drž ve středu 3:4 (y 240–1680), mřížka profilu ořezává */
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(700px 600px at 85% 30%, rgba(31,77,255,.16), transparent 70%),
      radial-gradient(700px 600px at 10% 85%, rgba(19,185,122,.14), transparent 70%),
      linear-gradient(rgba(31,77,255,.10) 2px, transparent 2px) 0 0 / 216px 216px,
      linear-gradient(90deg, rgba(31,77,255,.10) 2px, transparent 2px) 0 0 / 216px 216px,
      linear-gradient(rgba(31,77,255,.05) 1px, transparent 1px) 0 0 / 43.2px 43.2px,
      linear-gradient(90deg, rgba(31,77,255,.05) 1px, transparent 1px) 0 0 / 43.2px 43.2px,
      var(--paper); }
  .sph { position: absolute; border-radius: 50%; }
  .sph.b { background: radial-gradient(circle at 32% 28%, #9DB4FF 0%, #1F4DFF 45%, #0A2BB8 100%); box-shadow: 0 40px 80px rgba(31,77,255,.35); }
  .sph.g { background: radial-gradient(circle at 32% 28%, #8EF0C6 0%, #13B97A 48%, #0A7A4F 100%); box-shadow: 0 40px 80px rgba(19,185,122,.35); }
  .head { position: absolute; left: 0; right: 0; top: 280px; text-align: center; }
  .t1 { font: 750 128px/1 var(--sans); letter-spacing: -.06em; color: var(--ink); }
  .t2 { font: 800 210px/1 var(--sans); letter-spacing: -.065em; margin-top: 6px; padding-bottom: 20px;
        background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { position: absolute; background: #fff; border-radius: 40px; padding: 16px; box-shadow: 0 50px 110px rgba(10,13,20,.22); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 28px; }
  .lab { position: absolute; font: 650 40px var(--mono); padding: 14px 30px; border-radius: 40px; box-shadow: 0 14px 30px rgba(10,13,20,.18); white-space: nowrap; }
  .brand { position: absolute; left: 50%; transform: translateX(-50%); top: 1540px; background: #fff; border: 2px solid var(--line); border-radius: 60px;
           padding: 16px 40px; font: 700 48px var(--sans); letter-spacing: -.04em; color: var(--blue); box-shadow: 0 18px 40px rgba(10,13,20,.10); }
  .brand span { color: var(--green); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="sph b" style="width:150px;height:150px;left:870px;top:150px"></div>
  <div class="sph g" style="width:110px;height:110px;left:60px;top:1450px"></div>
  <div class="sph b" style="width:60px;height:60px;left:960px;top:1560px;opacity:.85"></div>

  <div class="head">
    <div class="t1">tutoriál</div>
    <div class="t2">ředitel</div>
  </div>

  <div class="card" style="left:60px;top:820px;width:460px;height:620px;transform:rotate(-5deg)">
    <img src="reditel_up.jpg" style="object-position:50% 35%">
    <span class="lab" style="left:-14px;top:-26px;background:var(--blue);color:#fff">ředitel</span>
  </div>
  <div class="card" style="left:560px;top:800px;width:460px;height:620px;transform:rotate(4deg)">
    <img src="ja.jpg" style="object-position:50% 30%">
    <span class="lab" style="right:-14px;bottom:-26px;background:var(--ink);color:#fff">já</span>
  </div>

  <div class="brand">efektive<span>.cz</span></div>
</body>
</html>
