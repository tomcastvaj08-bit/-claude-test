<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../engine/style.css">
<style>
  /* Generické pozadí EFEKTIVE bez textu, Instagram story 9:16 (1080×1920). Střed (y ~620–1300) je volný na text. */
  html, body { margin: 0; overflow: hidden; width: 1080px !important; height: 1920px !important; background: var(--paper); }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(760px 700px at 88% 14%, rgba(31,77,255,.20), transparent 70%),
      radial-gradient(700px 680px at 6% 90%, rgba(19,185,122,.18), transparent 70%),
      radial-gradient(600px 500px at 50% 52%, rgba(255,255,255,.75), transparent 75%),
      linear-gradient(rgba(31,77,255,.10) 2px, transparent 2px) 0 0 / 216px 216px,
      linear-gradient(90deg, rgba(31,77,255,.10) 2px, transparent 2px) 0 0 / 216px 216px,
      linear-gradient(rgba(31,77,255,.05) 1px, transparent 1px) 0 0 / 43.2px 43.2px,
      linear-gradient(90deg, rgba(31,77,255,.05) 1px, transparent 1px) 0 0 / 43.2px 43.2px, var(--paper); }
  .sph { position: absolute; border-radius: 50%; }
  .sph.b { background: radial-gradient(circle at 32% 28%, #9DB4FF 0%, #1F4DFF 45%, #0A2BB8 100%); box-shadow: 0 40px 80px rgba(31,77,255,.35); }
  .sph.g { background: radial-gradient(circle at 32% 28%, #8EF0C6 0%, #13B97A 48%, #0A7A4F 100%); box-shadow: 0 40px 80px rgba(19,185,122,.35); }
  .blur { filter: blur(6px); opacity: .75; }
  .tile { position: absolute; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 44px;
          box-shadow: 0 30px 70px rgba(10,13,20,.12); display: grid; place-items: center; }
  .tile svg { width: 56%; height: 56%; }
  .card { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 36px; box-shadow: 0 30px 80px rgba(10,13,20,.12); padding: 34px 38px; }
  .bar { height: 18px; border-radius: 9px; background: #E3E9FF; margin-top: 18px; }
  .bar.g { background: #DAF5E9; } .bar.k { background: #E8ECF2; }
  .dot { width: 22px; height: 22px; border-radius: 50%; display: inline-block; margin-right: 10px; }
  svg.path { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="bg"></div>

  <!-- tečkovaná cesta mezi ikonami -->
  <svg class="path" viewBox="0 0 1080 1920">
    <path d="M190 470 C 420 300, 620 520, 880 400" fill="none" stroke="#1F4DFF" stroke-opacity=".35" stroke-width="6" stroke-dasharray="2 18" stroke-linecap="round"/>
    <path d="M170 1500 C 420 1380, 640 1640, 900 1480" fill="none" stroke="#13B97A" stroke-opacity=".4" stroke-width="6" stroke-dasharray="2 18" stroke-linecap="round"/>
  </svg>

  <!-- koule -->
  <div class="sph b" style="width:190px;height:190px;left:820px;top:150px"></div>
  <div class="sph g" style="width:120px;height:120px;left:70px;top:1660px"></div>
  <div class="sph b blur" style="width:90px;height:90px;left:560px;top:250px"></div>
  <div class="sph g blur" style="width:70px;height:70px;left:930px;top:1700px"></div>
  <div class="sph b" style="width:60px;height:60px;left:960px;top:1150px"></div>
  <div class="sph g" style="width:46px;height:46px;left:60px;top:900px"></div>

  <!-- ikony nahoře: play, jiskry (AI), mikrofon -->
  <div class="tile" style="left:110px;top:380px;width:170px;height:170px;transform:rotate(-8deg)">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#1F4DFF"/><path d="M20 16 L33 24 L20 32 Z" fill="#fff"/></svg></div>
  <div class="tile" style="left:450px;top:330px;width:150px;height:150px;transform:rotate(6deg)">
    <svg viewBox="0 0 48 48"><path d="M24 6 L27.5 18.5 L40 22 L27.5 25.5 L24 38 L20.5 25.5 L8 22 L20.5 18.5 Z" fill="url(#gg)"/><path d="M38 34 L39.6 38.4 L44 40 L39.6 41.6 L38 46 L36.4 41.6 L32 40 L36.4 38.4 Z" fill="#13B97A"/>
      <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#1F4DFF"/><stop offset="1" stop-color="#13B97A"/></linearGradient></defs></svg></div>
  <div class="tile" style="left:790px;top:420px;width:160px;height:160px;transform:rotate(-5deg)">
    <svg viewBox="0 0 48 48"><rect x="17" y="6" width="14" height="24" rx="7" fill="#13B97A"/><path d="M11 22 a13 13 0 0 0 26 0" fill="none" stroke="#0A0D14" stroke-width="3.5" stroke-linecap="round"/><path d="M24 35 V42 M17 42 H31" stroke="#0A0D14" stroke-width="3.5" stroke-linecap="round"/></svg></div>

  <!-- dole: karta s waveformem, karta s „promptem“ (jen pruhy), kamera -->
  <div class="card" style="left:90px;top:1330px;width:430px;height:170px;transform:rotate(-4deg)">
    <svg viewBox="0 0 360 100" style="width:100%;height:100%">
      <g fill="#1F4DFF">
        <rect x="0" y="40" width="10" height="20" rx="5"/><rect x="22" y="28" width="10" height="44" rx="5"/><rect x="44" y="14" width="10" height="72" rx="5"/><rect x="66" y="30" width="10" height="40" rx="5"/>
        <rect x="88" y="6" width="10" height="88" rx="5"/><rect x="110" y="24" width="10" height="52" rx="5"/><rect x="132" y="36" width="10" height="28" rx="5"/><rect x="154" y="18" width="10" height="64" rx="5"/>
      </g><g fill="#13B97A">
        <rect x="176" y="8" width="10" height="84" rx="5"/><rect x="198" y="26" width="10" height="48" rx="5"/><rect x="220" y="38" width="10" height="24" rx="5"/><rect x="242" y="16" width="10" height="68" rx="5"/>
        <rect x="264" y="30" width="10" height="40" rx="5"/><rect x="286" y="42" width="10" height="16" rx="5"/><rect x="308" y="22" width="10" height="56" rx="5"/><rect x="330" y="36" width="10" height="28" rx="5"/>
      </g></svg></div>
  <div class="card" style="left:560px;top:1290px;width:430px;transform:rotate(3deg)">
    <div><span class="dot" style="background:#D42A1E"></span><span class="dot" style="background:#F07A1A"></span><span class="dot" style="background:#13B97A"></span></div>
    <div class="bar" style="width:92%"></div><div class="bar" style="width:74%"></div><div class="bar g" style="width:84%"></div><div class="bar k" style="width:58%"></div>
  </div>
  <div class="tile" style="left:450px;top:1580px;width:150px;height:150px;transform:rotate(-6deg)">
    <svg viewBox="0 0 48 48"><rect x="5" y="14" width="28" height="22" rx="6" fill="#0A0D14"/><path d="M33 21 L43 15 V35 L33 29 Z" fill="#1F4DFF"/><circle cx="14" cy="21" r="3" fill="#13B97A"/></svg></div>
</body>
</html>
