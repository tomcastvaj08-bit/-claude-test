# EFEKTIVE Captions – sestavení iOS aplikace a nahrání do TestFlight (App Store Connect)
# Potřebuje GitHub Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64 (API klíč App Store Connect), APPLE_TEAM_ID.
name: EFEKTIVE Captions – iOS
on:
  push:
    branches: [claude/lucid-maxwell-4k9eaj]
    paths: ['efektive-captions/app/public/**', 'efektive-captions/mobile/**', '.github/workflows/efektive-ios.yml']
  workflow_dispatch:
jobs:
  # levná kontrola na Linuxu: Mac (drahé minuty) se spustí jen když jsou nastavené klíče Apple
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          HAS: ${{ secrets.ASC_KEY_P8_B64 != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "ok=$HAS" >> "$GITHUB_OUTPUT"
          [ "$HAS" = "true" ] || echo "Apple klíče zatím nejsou nastavené – iOS sestavení přeskakuji."
  ios:
    needs: check
    if: ${{ needs.check.outputs.ok == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_APPLE: 'true'
    defaults: { run: { working-directory: efektive-captions/mobile } }
    steps:
      - name: Chybí klíče Apple → přeskočeno
        if: ${{ env.HAS_APPLE != 'true' }}
        working-directory: .
        run: echo "Apple klíče zatím nejsou nastavené (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64, APPLE_TEAM_ID) – iOS sestavení přeskakuji."
      - uses: actions/checkout@v4
        if: ${{ env.HAS_APPLE == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ env.HAS_APPLE == 'true' }}
        with: { node-version: 22 }
      - if: ${{ env.HAS_APPLE == 'true' }}
        run: npm ci && npm run sync
      - name: Sestavit a nahrát do TestFlight
        if: ${{ env.HAS_APPLE == 'true' }}
        working-directory: efektive-captions/mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"; echo "${{ secrets.ASC_KEY_P8_B64 }}" | base64 -d > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 $AUTH archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH
