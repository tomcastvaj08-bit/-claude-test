<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Best Account – šablona banneru</title>
<style>
@font-face{font-family:"Urbanist";font-weight:100 900;font-display:block;src:url(assets/fonts/urbanist-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Urbanist";font-weight:100 900;font-display:block;src:url(assets/fonts/urbanist-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* ===== DESIGN TOKENY (změřeno z původních bannerů 1254×1254) ===== */
:root{
  --size:1254px;
  --blue:#0068FF;          /* akcent na světlém */
  --blue-dark:#1673FF;     /* akcent na tmavém */
  --ink:#0B0B0B;           /* nadpis na světlém */
  --body-ink:#151515;      /* text na světlém */
  --navy:#08163A;          /* tmavé pozadí */
  --margin-left:77px;      /* levý okraj textu */
  --col-right:690px;       /* začátek textu u pravé varianty */
  --h-size:114px;          /* nadpis */
  --h-lh:109px;            /* rozteč řádků nadpisu */
  --h-track:-0.01em;
  --b-size:48px;           /* běžný text */
  --b-lh:59px;             /* rozteč řádků textu */
  --b-weight:500;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--size);height:var(--size);overflow:hidden;background:#fff}
#c{position:relative;width:var(--size);height:var(--size);overflow:hidden;font-family:"Urbanist",sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#fade{position:absolute;inset:0}
#hex{position:absolute;inset:0;pointer-events:none}
#logo{position:absolute;left:62px;top:80px;width:388px;height:116px}
#logo img{position:absolute;inset:0}
#txt{position:absolute;left:var(--margin-left)}
.side-right #txt{left:var(--col-right)}
h1{font-weight:800;font-size:var(--h-size);line-height:var(--h-lh);letter-spacing:var(--h-track);color:var(--ink);white-space:nowrap}
h1 em{font-style:normal;color:var(--blue)}
.rule{position:relative;height:14px;margin:var(--rule-gap,34px) 0 var(--rule-after,31px)}
.rule i{position:absolute;top:5px;height:3px;background:var(--blue);border-radius:2px}
.rule b{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--blue);top:0}
/* světlá: tečka vlevo + dlouhá linka */
.light .rule b{left:0}.light .rule i{left:6px;width:406px}
/* tmavá: krátká linka + malá tečka za mezerou */
.dark .rule i{left:2px;width:128px}.dark .rule b{left:142px;width:7px;height:7px;top:3px}
p.b{font-size:var(--b-size);line-height:var(--b-lh);font-weight:var(--b-weight);color:var(--body-ink);letter-spacing:0.004em;white-space:nowrap}
p.b + p.b{margin-top:22px}
p.b strong{font-weight:700}
ul.checks{list-style:none}
ul.checks li{position:relative;padding-left:66px;font-size:40px;line-height:50px;font-weight:var(--b-weight);color:var(--body-ink);white-space:nowrap}
ul.checks li + li{margin-top:24px}
ul.checks li svg{position:absolute;left:0;top:6px;width:42px;height:38px}
ul.checks li strong{display:block;font-weight:700;font-size:40px}
ul.checks li span{display:block;font-size:36px;line-height:46px;opacity:.95}
ul.checks + p.b, p.b + ul.checks{margin-top:30px}
.phone{display:flex;align-items:center;gap:22px;margin-top:46px;font-weight:700;font-size:42px;color:var(--blue);letter-spacing:-0.005em}
.phone svg{width:50px;height:50px}
#arrow{position:absolute;left:1093px;top:1138px;width:102px;height:48px}
/* tmavá varianta */
.dark h1{color:#fff}.dark h1 em{color:var(--blue-dark)}
.dark p.b,.dark ul.checks li{color:#F4F7FF}
.dark .rule i,.dark .rule b{background:var(--blue-dark)}
.dark .phone{color:#fff}

/* ===== MODRÁ varianta (pestřejší: gradient, záře, částice) ===== */
.blue{--accent:#8CCBFF}
.blue h1{color:#fff}.blue h1 em{color:var(--accent)}
.blue p.b,.blue ul.checks li{color:#EEF4FF}
.blue .rule i,.blue .rule b{background:var(--accent)}
.blue .rule i{left:2px;width:128px}.blue .rule b{left:142px;width:7px;height:7px;top:3px}
.blue .phone{color:#fff}
#deco,#extra,#tone{position:absolute;inset:0;pointer-events:none}
#ext{position:absolute;top:0;bottom:0;pointer-events:none}
#tone{mix-blend-mode:lighten}
#deco canvas{position:absolute;inset:0}
#person{position:absolute;display:none}
/* kontakt v boxu */
.contact{display:flex;align-items:center;gap:26px;margin-top:44px}
.contact .ic{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none;box-shadow:0 10px 28px rgba(0,60,200,.35)}
.blue .contact .ic{background:#fff;color:var(--blue);box-shadow:0 10px 30px rgba(0,20,90,.35)}
.contact .ic svg{width:52px;height:52px}
.contact .ic svg path{fill:currentColor;stroke:none}
.contact small{display:block;font-size:34px;line-height:40px;font-weight:500;color:var(--body-ink)}
.contact b{display:block;font-size:54px;line-height:62px;font-weight:800;letter-spacing:-0.01em;color:var(--blue);white-space:nowrap}
.contact.ink b{color:var(--ink)}
.blue .contact small{color:#DCE8FF}.blue .contact b{color:#fff}
.dark .contact small{color:#DCE8FF}.dark .contact b{color:#fff}
/* kontakt jako tlačítko */
.pillwrap{margin-top:46px}
.pillwrap small,.bignum small{display:block;font-size:34px;line-height:40px;font-weight:500;color:var(--body-ink);margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:20px;padding:22px 42px 22px 30px;border-radius:999px;background:var(--blue);color:#fff;font-size:46px;font-weight:800;letter-spacing:-0.005em;white-space:nowrap;box-shadow:0 14px 30px rgba(0,104,255,.30)}
.pill svg{width:46px;height:46px}.pill svg path{fill:#fff}
/* kontakt jako velké číslo */
.bignum{margin-top:44px}
.bignum b{display:block;font-size:68px;line-height:72px;font-weight:800;letter-spacing:-0.015em;color:var(--blue);white-space:nowrap}
/* sociální důkaz */
.proof{position:absolute}
.proof.inline{position:static}
.proof.inline .row img{height:84px}.proof.inline .num{font-size:78px}.proof.inline p{font-size:32px;line-height:38px;margin-top:10px}.proof.inline .stars svg{width:36px;height:36px}
.proof .row{display:flex;align-items:center;gap:22px}
.proof .row img{height:96px}
.proof .num{font-size:92px;line-height:1;font-weight:800;letter-spacing:-0.02em;color:var(--ink)}
.blue .proof .num,.dark .proof .num{color:#fff}
.proof p{font-size:34px;line-height:42px;font-weight:500;margin-top:14px;color:var(--body-ink);white-space:nowrap}
.blue .proof p,.dark .proof p{color:#EEF4FF}
.proof .stars{display:flex;gap:8px;margin-top:12px}
.proof .stars svg{width:40px;height:40px}
/* komory */
.badges{position:absolute;top:84px;right:60px;display:flex;align-items:center;gap:26px}
.badges img{height:104px}
.badges img.ka{height:100px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
/* web */
.web{position:absolute;right:62px;bottom:62px;font-size:34px;font-weight:600;letter-spacing:.01em;color:#fff;text-shadow:0 2px 12px rgba(0,20,80,.45)}
.light .web.ink{color:var(--ink);text-shadow:none}
/* mockup telefonu */
.mock{position:absolute;width:330px;height:640px;border-radius:58px;background:#11141a;padding:12px;box-shadow:0 30px 60px rgba(0,30,110,.35),inset 0 0 0 2px #3a3f48}
.mock .scr{position:relative;width:100%;height:100%;border-radius:47px;background:#fff;overflow:hidden;font-family:"Urbanist",sans-serif}
.mock .isl{position:absolute;left:50%;top:13px;width:108px;height:32px;border-radius:20px;background:#0b0d10;transform:translateX(-50%)}
.mock .st{position:absolute;top:17px;left:30px;right:26px;display:flex;justify-content:space-between;font-size:17px;font-weight:700;color:#111}
.mock .brand{position:absolute;top:84px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px}
.mock .brand img.i{width:44px;height:44px}
.mock .brand img.w{height:44px;width:auto;margin-left:-6px}
.mock .no{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:33px;font-weight:600;color:#111;letter-spacing:.01em}
.mock .keys{position:absolute;top:226px;left:34px;right:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px;justify-items:center}
.mock .keys div{width:70px;height:70px;border-radius:50%;background:#EEF0F4;display:grid;place-items:center;text-align:center;line-height:1}
.mock .keys div span{display:block;font-size:30px;font-weight:500;color:#111}
.mock .keys div i{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.14em;color:#333;margin-top:2px}
.mock .call{position:absolute;bottom:36px;left:50%;width:74px;height:74px;margin-left:-37px;border-radius:50%;background:#2DC653;display:grid;place-items:center}
.mock .call svg{width:36px;height:36px}

/* ===== zarovnání doprava (text vpravo) ===== */
.align-right #txt{text-align:right}
.align-right.light .rule b{left:auto;right:0}.align-right.light .rule i{left:auto;right:6px}
.align-right.dark .rule i,.align-right.blue .rule i{left:auto;right:2px}
.align-right.dark .rule b,.align-right.blue .rule b{left:auto;right:142px}
.align-right .contact{flex-direction:row-reverse}
.align-right .proof .row{flex-direction:row-reverse}
.align-right .proof .stars{justify-content:flex-end}
</style>
</head>
<body>
<div id="c">
  <div id="ext"></div>
  <img id="bg" alt="">
  <div id="tone"></div>
  <div id="deco"></div>
  <img id="person" alt="">
  <div id="fade"></div>
  <svg id="hex" viewBox="0 0 1254 1254"></svg>
  <div id="extra"></div>
  <div id="logo"><img id="icon" src="assets/logo_icon_hd.png" alt="" style="left:10px;top:8px;width:101px;height:100px"><img id="word" src="assets/logo_word_black.png" alt=""></div>
  <div id="txt"></div>
  <svg id="arrow" viewBox="0 0 102 48" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24H97M76 4L97 24L76 44"/></svg>
</div>
<script>
const CHECK = '<svg viewBox="0 0 42 38"><path d="M4 20L15 31L38 6" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
// *modře* = akcent, **tučně** = tučně, \n = nový řádek
const fmt = s => esc(s).replace(/\*\*([\s\S]+?)\*\*/g,'<strong>$1</strong>').replace(/\*([\s\S]+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');

function hexes(theme, corners){
  // hexagony "na špičku" (pointy-top), R = 76 px
  const R=76, W=Math.sqrt(3)*R, V=1.5*R;
  let s='<defs>';
  corners.forEach((k,i)=>{
    const [cx,cy,rad]=k;
    s+=`<radialGradient id="m${i}" cx="${cx}" cy="${cy}" r="${rad}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="k${i}"><rect width="1254" height="1254" fill="url(#m${i})"/></mask>`;
  });
  s+='</defs>';
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  corners.forEach((k,i)=>{
    const [cx,cy,rad]=k; let g='';
    for(let row=-2; row<16; row++){
      for(let col=-2; col<14; col++){
        const x=col*W+(row%2?W/2:0)-30, y=row*V-10;
        if(Math.hypot(x-cx,y-cy)>rad+R) continue;
        let pts=[];for(let a=0;a<6;a++){const t=Math.PI/180*(60*a-90);pts.push((x+(R-3)*Math.cos(t)).toFixed(1)+','+(y+(R-3)*Math.sin(t)).toFixed(1));}
        if(theme==='light'){
          const o=(0.35+rnd()*0.55).toFixed(2);
          g+=`<polygon points="${pts}" fill="#5B9BFF" fill-opacity="${o*0.55}" stroke="#fff" stroke-opacity=".9" stroke-width="3"/>`;
        }else if(theme==='blue'){
          const o=(0.05+rnd()*0.22).toFixed(2);
          g+=`<polygon points="${pts}" fill="#9CC8FF" fill-opacity="${o}" stroke="#BFDBFF" stroke-opacity=".55" stroke-width="2.2"/>`;
        }else{
          const o=(0.15+rnd()*0.35).toFixed(2);
          g+=`<polygon points="${pts}" fill="#0E2A6E" fill-opacity="${o}" stroke="#2F7BFF" stroke-opacity=".85" stroke-width="2.2"/>`;
        }
      }
    }
    s+=`<g mask="url(#k${i})"${theme==='dark'?' style="filter:drop-shadow(0 0 6px rgba(40,120,255,.55))"':theme==='blue'?' style="filter:drop-shadow(0 0 8px rgba(160,210,255,.6))"':''}>${g}</g>`;
  });
  return s;
}

const STAR='<svg viewBox="0 0 24 24"><path fill="#FFC21A" d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5 1.4-7.1-5.3-5 7.2-.9z"/></svg>';
const PHONE_SOLID='<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';

// pozadí: modrý gradient, záře, částice, vodoznak lva
function deco(B, theme){
  const d=document.getElementById('deco'); d.innerHTML=''; d.style.background='';
  const mode = B.deco ?? (theme==='blue' ? 'blue' : null);
  if(!mode) return;
  const g=B.glow; // [x,y,r] záře za postavou
  if(mode==='blue'){
    d.style.background = [
      g?`radial-gradient(${g[2]}px ${g[2]}px at ${g[0]}px ${g[1]}px, rgba(214,232,255,.92) 0%, rgba(140,190,255,.55) 32%, rgba(60,130,255,0) 70%)`:'',
      'radial-gradient(760px 620px at 0px 1254px, rgba(4,30,120,.85) 0%, rgba(4,30,120,0) 70%)',
      'radial-gradient(900px 520px at 20% -8%, rgba(70,150,255,.75) 0%, rgba(70,150,255,0) 70%)',
      'linear-gradient(140deg, #0B5BFF 0%, #0A48D8 34%, #0835A8 64%, #06226E 100%)'
    ].filter(Boolean).join(',');
  }else if(mode==='lightblue'){
    d.style.background = [
      g?`radial-gradient(${g[2]}px ${Math.round(g[2]*1.15)}px at ${g[0]}px ${g[1]}px, rgba(0,104,255,.42) 0%, rgba(0,104,255,.22) 40%, rgba(0,104,255,.07) 62%, rgba(0,104,255,0) 80%)`:'',
      'radial-gradient(900px 620px at 105% 108%, rgba(0,104,255,.30) 0%, rgba(0,104,255,0) 72%)',
      'linear-gradient(165deg, #FFFFFF 0%, #F6F9FF 38%, #E4EEFF 100%)'
    ].filter(Boolean).join(',');
  }
  if(mode==='lightblue' && !B.particles) return;
  // vodoznak lva
  if(B.watermark!==false){
    const w=B.watermark||[640,300,860];
    d.innerHTML+=`<img src="assets/logo_icon_hd.png" style="position:absolute;left:${w[0]}px;top:${w[1]}px;width:${w[2]}px;opacity:${mode==='blue'?.10:.07};${mode==='blue'?'filter:brightness(3) saturate(0);mix-blend-mode:soft-light;opacity:.35':''}">`;
  }
  // částice / bokeh
  const cv=document.createElement('canvas'); cv.width=1254; cv.height=1254; d.appendChild(cv);
  const x=cv.getContext("2d"); let seed=11; const r=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const light = mode==='blue';
  for(let i=0;i<26;i++){ // bokeh
    const px=r()*1254, py=r()*1254, rr=14+r()*46;
    const gr=x.createRadialGradient(px,py,0,px,py,rr);
    const c= light?'255,255,255':'0,104,255';
    gr.addColorStop(0,`rgba(${c},${(light?.10:.08)+r()*.08})`); gr.addColorStop(1,`rgba(${c},0)`);
    x.fillStyle=gr; x.beginPath(); x.arc(px,py,rr,0,7); x.fill();
  }
  for(let i=0;i<110;i++){ // jiskry
    const px=r()*1254, py=r()*1254, rr=.8+r()*2.6, o=.25+r()*.6;
    x.fillStyle= light?`rgba(220,236,255,${o})`:`rgba(0,104,255,${o*.55})`;
    x.shadowColor= light?'rgba(160,210,255,.9)':'rgba(0,104,255,.6)'; x.shadowBlur=8;
    x.beginPath(); x.arc(px,py,rr,0,7); x.fill();
  }
  x.shadowBlur=0;
  // jemné světelné paprsky
  if(light){
    x.globalCompositeOperation='screen';
    for(const [a,o] of [[-0.42,.07],[-0.30,.05]]){
      x.save(); x.translate(1254,0); x.rotate(a);
      const lg=x.createLinearGradient(-1600,0,0,0); lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(1,`rgba(200,225,255,${o})`);
      x.fillStyle=lg; x.fillRect(-1600,-60,1600,120); x.restore();
    }
  }
}

function extras(B, theme){
  const e=document.getElementById('extra'); let h='';
  if(B.badges) h+=`<div class="badges" style="${B.badges.top?`top:${B.badges.top}px;`:''}"><img class="ka" src="assets/komora_auditoru.png"><img src="assets/komora_danovych_poradcu${theme==='light'?'_navy':''}.png"></div>`;
  if(B.proof && !B.proof.inline){
    const p=B.proof;
    h+=`<div class="proof" style="left:${p.x??77}px;top:${p.y}px"><div class="row"><img src="assets/avatary.png"><span class="num">${esc(p.count||'700+')}</span></div><p>${fmt(p.text||'Více než 700 spokojených klientů')}</p>${p.stars===false?'':`<div class="stars">${STAR.repeat(5)}</div>`}</div>`;
  }
  if(B.mockup){
    const m=B.mockup;
    const keys=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
    h+=`<div class="mock" style="left:${m.x}px;top:${m.y}px;transform:rotate(${m.rot??0}deg) scale(${m.scale??1});transform-origin:top left"><div class="scr"><div class="isl"></div><div class="st"><span>9:41</span><span>●●● ▮</span></div>
      <div class="brand"><img class="i" src="assets/logo_icon_hd.png"><img class="w" src="assets/logo_word_black.png" style="clip-path:inset(0 0 0 31%);margin-left:-50px"></div>
      <div class="no">${esc(m.phone||B.phoneNo||'+420 721 075 783')}</div>
      <div class="keys">${keys.map(k=>`<div><span>${k[0]}</span>${k[1]?`<i>${k[1]}</i>`:''}</div>`).join('')}</div>
      <div class="call">${PHONE_SOLID.replace('<path','<path fill="#fff"')}</div></div></div>`;
  }
  if(B.web) h+=`<div class="web${B.webInk?' ink':''}"${B.webLeft?' style="right:auto;left:62px"':''}>${esc(B.web)}</div>`;
  e.innerHTML=h;
}

function render(B){
  const c=document.getElementById('c');
  const theme=B.theme||'light', side=B.side||'left';
  c.className=theme+' side-'+side+((side==='right' && B.align!=='left')?' align-right':'');
  document.body.style.background = theme==='dark' ? '#08163A' : '#fff';
  const bg=document.getElementById('bg');
  if(B.bg){bg.src=B.bg;bg.style.display='';bg.style.objectPosition=B.bgPos||'center';} else bg.style.display='none';
  // bgBox: [vlevo, nahoře, šířka] – ruční umístění fotky (portréty apod.), bgColor = barva okolo fotky
  if(B.bgBox){Object.assign(bg.style,{inset:'auto',left:B.bgBox[0]+'px',top:B.bgBox[1]+'px',width:B.bgBox[2]+'px',height:'auto',objectFit:'fill',webkitMaskImage:(()=>{const n=B.bgFeather??180, sd=B.bgFeatherSide||'left'; return sd==='right'?`linear-gradient(270deg,transparent 0,#000 ${n}px)`: sd==='both'?`linear-gradient(90deg,transparent 0,#000 ${n}px,#000 calc(100% - ${n}px),transparent 100%)`:`linear-gradient(90deg,transparent 0,#000 ${n}px)`})()});}
  else Object.assign(bg.style,{inset:'0',left:'',top:'',width:'100%',height:'100%',objectFit:'cover',webkitMaskImage:''});
  c.style.background = B.bgColor || (theme==='light' ? '#fff' : '#08163A');
  // bgExtend: pozadí fotky plynule pokračuje za její okraj a přechází do barvy banneru (mimo postavu)
  const ex=document.getElementById('ext');
  if(B.bgExtend && B.bgBox){
    const to=B.bgColor || (theme==='light' ? '#fff' : '#08163A');
    const sd=B.bgFeatherSide||'left', f=B.bgFeather??180;
    if(sd==='right'){ const x0=B.bgBox[0]+B.bgBox[2]-f; Object.assign(ex.style,{display:'block',left:x0+'px',right:'0',background:`linear-gradient(90deg, ${B.bgExtend} 0px, ${B.bgExtend} ${f}px, ${to} 100%)`}); }
    else { const x1=B.bgBox[0]+f; Object.assign(ex.style,{display:'block',left:'0',width:x1+'px',background:`linear-gradient(270deg, ${B.bgExtend} 0px, ${B.bgExtend} ${f}px, ${to} 100%)`}); }
  } else ex.style.display='none';
  document.getElementById('word').src = theme==='light' ? 'assets/logo_word_black.png' : 'assets/logo_word_white.png';
  document.getElementById('icon').src = theme==='blue' ? 'assets/logo_icon_hd_inverzni.png' : 'assets/logo_icon_hd.png';
  document.getElementById('tone').style.background = B.tone || 'none';
  deco(B, theme);
  const pe=document.getElementById('person');
  if(B.person){ pe.src=B.person.src; Object.assign(pe.style,{display:'block',left:B.person.box[0]+'px',top:B.person.box[1]+'px',width:B.person.box[2]+'px',filter:B.person.shadow===false?'':(theme==='light'?'drop-shadow(0 18px 36px rgba(0,40,120,.16))':'drop-shadow(0 20px 40px rgba(0,20,90,.35))')}); }
  else pe.style.display='none';
  extras(B, theme);
  // závoj pro čitelnost textu na straně textu
  const col = theme==='dark' ? '8,22,58' : '255,255,255';
  const dir = side==='left' ? '90deg' : '270deg';
  const f = B.fade ?? 1;
  document.getElementById('fade').style.background =
    (B.fade===0 || (theme==='blue' && B.fade==null)) ? 'none' :
    `linear-gradient(${dir}, rgba(${col},${.94*f}) 0%, rgba(${col},${.82*f}) 30%, rgba(${col},${.45*f}) 48%, rgba(${col},0) 64%)`;
  // hexagony v rozích
  const corners = B.hex ?? (side==='left' ? [[0,1254,560]] : [[1254,1254,520],[1254,0,330]]);
  document.getElementById('hex').innerHTML = hexes(theme, corners);
  // text
  let h='';
  h+=`<h1 style="${B.hSize?`font-size:${B.hSize}px;line-height:${Math.round(B.hSize*0.956)}px`:''}">${fmt(B.headline)}</h1>`;
  if(B.rule!==false) h+='<div class="rule"><i></i><b></b></div>';
  (B.body||[]).forEach(p=>{ h+= typeof p==='string' ? `<p class="b"${B.bSize?` style="font-size:${B.bSize}px;line-height:${Math.round(B.bSize*1.3)}px"`:''}>${fmt(p)}</p>` : ''; });
  if(B.checks){
    h+='<ul class="checks">'+B.checks.map(x=>{
      const ic=`<span style="color:var(--${theme==='dark'?'blue-dark':'blue'})">${CHECK}</span>`;
      return typeof x==='string' ? `<li>${ic}${fmt(x)}</li>` : `<li>${ic}<strong>${fmt(x.title)}</strong><span>${fmt(x.text)}</span></li>`;
    }).join('')+'</ul>';
  }
  (B.after||[]).forEach(p=>{ h+=`<p class="b">${fmt(p)}</p>`; });
  if(B.phone) h+=`<div class="phone">${PHONE}<span>${esc(B.phone)}</span></div>`;
  if(B.contact && B.contact.style==='pill') h+=`<div class="pillwrap"${B.contact.mt!=null?` style="margin-top:${B.contact.mt}px"`:''}>${B.contact.label?`<small>${fmt(B.contact.label)}</small>`:''}<div class="pill">${PHONE_SOLID}<span>${esc(B.contact.phone||'+420 721 075 783')}</span></div></div>`;
  else if(B.contact && B.contact.style==='big') h+=`<div class="bignum"${B.contact.mt!=null?` style="margin-top:${B.contact.mt}px"`:''}>${B.contact.label?`<small>${fmt(B.contact.label)}</small>`:''}<b${B.contact.size?` style="font-size:${B.contact.size}px;line-height:${Math.round(B.contact.size*1.08)}px"`:''}>${esc(B.contact.phone||'+420 721 075 783')}</b></div>`;
  else if(B.contact) h+=`<div class="contact${B.contact.ink?' ink':''}"${B.contact.mt!=null?` style="margin-top:${B.contact.mt}px"`:''}><div class="ic">${PHONE_SOLID}</div><div>${B.contact.label?`<small>${fmt(B.contact.label)}</small>`:''}<b${B.contact.size?` style="font-size:${B.contact.size}px;line-height:${Math.round(B.contact.size*1.15)}px"`:''}>${esc(B.contact.phone||'+420 721 075 783')}</b></div></div>`;
  if(B.proof && B.proof.inline){ const p=B.proof; h+=`<div class="proof inline" style="margin-top:${p.mt??40}px"><div class="row"><img src="assets/avatary.png"><span class="num">${esc(p.count||'700+')}</span></div><p>${fmt(p.text||'Více než 700 spokojených klientů')}</p>${p.stars===false?'':`<div class="stars">${STAR.repeat(5)}</div>`}</div>`; }
  const t=document.getElementById('txt'); t.innerHTML=h;
  if(side==='right' && B.align!=='left'){ t.style.left='auto'; t.style.right=(B.xr??77)+'px'; }
  else { t.style.right=''; t.style.left = B.x!=null ? B.x+'px' : ''; }
  // horní okraj: vrchol verzálky prvního řádku nadpisu = B.top (výchozí 292 px jako v originálech)
  const capTop = B.top ?? 296;
  const hs = B.hSize || 114, lh = B.hSize?Math.round(B.hSize*0.956):109;
  // Urbanist: ascent .95, descent .25, cap height .70 (v em)
  const half=(lh-(0.95+0.25)*hs)/2;
  t.style.top = (capTop - half - (0.95-0.70)*hs) + 'px';
  document.getElementById('arrow').style.display = B.arrow===false ? 'none' : '';
}
window.render=render;
if(!window.__AUTOMATED){
  render({theme:'light',side:'left',headline:'Rozrostlo se\nvám\n*podnikání?*',body:['A obyčejná tabulka\nv Excelu už vám\npřestává stačit?']});
}
</script>
</body>
</html>
