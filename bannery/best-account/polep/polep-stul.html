@font-face{font-family:"RC";font-weight:500;src:url(../assets/fonts/roboto-condensed-500-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
/* 1200 × 700 mm + spadávka 3 mm = 1206 × 706 mm */
@page{size:1206mm 706mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1206mm;height:706mm;background:#fff}
#p{position:relative;width:1206mm;height:706mm;background:#fff;overflow:hidden;font-family:"RC",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#g{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
#icon{width:252mm;height:auto;display:block}
#t1{font-weight:500;color:#111;white-space:nowrap;line-height:1;margin-top:47mm}
#t2{font-weight:400;color:#707070;white-space:nowrap;line-height:1;margin-top:22mm}
</style>
</head>
<body>
<div id="p">
  <div id="g">
    <img id="icon" src="../assets/logo_icon_hd_3000px.png" alt="">
    <div id="t1">BEST ACCOUNT</div>
    <div id="t2">VAŠE ÚČETNÍ A DAŇOVÁ KANCELÁŘ</div>
  </div>
</div>
<script>
// oba řádky na stejnou šířku jako v originálním logu (šířka nápisu ≈ 2,31 × šířka ikony)
function fit(el,mm){ el.style.fontSize='100mm'; const w=el.getBoundingClientRect().width, px=mm*96/25.4; el.style.fontSize=(100*px/w)+'mm'; }
window.layout=()=>{ const W=252*372/161; fit(document.getElementById('t1'),W); fit(document.getElementById('t2'),W); };
</script>
