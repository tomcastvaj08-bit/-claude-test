<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Best Account – PF 2027 zadní strana</title>
<style>
@font-face{font-family:"Urbanist";font-weight:100 900;font-display:block;src:url(assets/fonts/urbanist-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0}
@font-face{font-family:"Urbanist";font-weight:100 900;font-display:block;src:url(assets/fonts/urbanist-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#08163A}
#c{position:relative;overflow:hidden;background:#08163A;font-family:"Urbanist",sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#c > *{position:absolute}
#glow,#hex{inset:0}
#mark{display:none}
#logo img{position:absolute}
#info{left:0;right:0;text-align:center}
#info .web{font-weight:700;color:#fff;letter-spacing:.01em}
#info .tel{font-weight:500;color:#0088DA;margin-top:.35em}
#line{left:50%;background:#0088DA;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="c">
  <div id="glow"></div>
  <img id="mark" src="assets/logo_icon_hd.png" alt="">
  <svg id="hex"></svg>
  <div id="logo"><img id="icon" src="assets/logo_icon_hd.png" alt=""><img id="word" src="assets/logo_word_white.png" alt=""></div>
  <div id="line"></div>
  <div id="info"><div class="web">www.BestAccount.cz</div><div class="tel">+420 721 075 783</div></div>
</div>
<script>
function hexes(W,H,u,cx,cy,rad,id){
  const R=118*u, w=Math.sqrt(3)*R, v=1.5*R;
  let s=`<defs><radialGradient id="m${id}" cx="${cx}" cy="${cy}" r="${rad}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="k${id}"><rect width="${W}" height="${H}" fill="url(#m${id})"/></mask></defs>`;
  let seed=7+id; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647); let g='';
  for(let row=-2; row*v<H+2*R; row++) for(let col=-2; col*w<W+2*R; col++){
    const x=col*w+(row%2?w/2:0), y=row*v;
    if(Math.hypot(x-cx,y-cy)>rad+R) continue;
    const pts=[];for(let a=0;a<6;a++){const t=Math.PI/180*(60*a-90);pts.push((x+(R-4*u)*Math.cos(t)).toFixed(1)+','+(y+(R-4*u)*Math.sin(t)).toFixed(1));}
    const o=(0.12+rnd()*0.33).toFixed(2);
    g+=`<polygon points="${pts}" fill="#0E2A6E" fill-opacity="${o}" stroke="#1E9BE8" stroke-opacity=".95" stroke-width="${3*u}"/>`;
  }
  return s+`<g mask="url(#k${id})" style="filter:drop-shadow(0 0 ${8*u}px rgba(0,136,218,.5))">${g}</g>`;
}
function render(o){
  const W=o.w,H=o.h,u=H/1800;
  for(const el of [document.documentElement,document.body]) el.style.cssText=`width:${W}px;height:${H}px`;
  const c=document.getElementById('c'); c.style.width=W+'px'; c.style.height=H+'px';
  document.getElementById('glow').style.background=`radial-gradient(${1500*u}px ${1000*u}px at ${W/2}px ${H*0.42}px, rgba(0,136,218,.22), rgba(0,136,218,0) 70%)`;
  const hx=document.getElementById('hex'); hx.setAttribute('viewBox',`0 0 ${W} ${H}`); hx.setAttribute('width',W); hx.setAttribute('height',H);
  hx.innerHTML=hexes(W,H,u,-60*u,H+60*u,1300*u,1)+hexes(W,H,u,W+60*u,-60*u,1200*u,2);
  const ms=2300*u; Object.assign(document.getElementById('mark').style,{left:(W-ms*0.62)+'px',top:(H*0.38)+'px',width:ms+'px',height:ms+'px',transform:'rotate(-14deg)'});
  // logo uprostřed (proporce 388×116, ikona 10/8/101/100)
  const k=4.2*u, lw=388*k, lh=116*k, L=document.getElementById('logo');
  Object.assign(L.style,{left:(W-lw)/2+'px',top:(H*0.40-lh/2)+'px',width:lw+'px',height:lh+'px'});
  Object.assign(document.getElementById('icon').style,{left:10*k+'px',top:8*k+'px',width:101*k+'px',height:100*k+'px'});
  Object.assign(document.getElementById('word').style,{left:0,top:0,width:lw+'px',height:lh+'px'});
  Object.assign(document.getElementById('line').style,{top:(H*0.40+lh/2+110*u)+'px',width:220*u+'px',height:7*u+'px',borderRadius:4*u+'px'});
  Object.assign(document.getElementById('info').style,{top:(H*0.40+lh/2+190*u)+'px',fontSize:118*u+'px'});
  document.querySelector('#info .tel').style.fontSize=96*u+'px';
}
window.render=render;
</script>
</body>
</html>
