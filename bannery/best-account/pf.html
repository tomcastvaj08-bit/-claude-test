<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Best Account – PF 2027</title>
<style>
@font-face{font-family:"Urbanist";font-weight:100 900;font-display:block;src:url(assets/fonts/urbanist-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0}
@font-face{font-family:"Urbanist";font-weight:100 900;font-display:block;src:url(assets/fonts/urbanist-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
:root{--blue:#0088DA;--navy:#08163A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--navy)}
#c{position:relative;overflow:hidden;font-family:"Urbanist",sans-serif;-webkit-font-smoothing:antialiased;background:var(--navy);color:#fff}
#c > *{position:absolute}
#glow,#hex{inset:0}
#lion{object-fit:cover}
#marks{inset:0;pointer-events:none}
#marks img{position:absolute;filter:drop-shadow(0 0 10px rgba(0,136,218,.85)) drop-shadow(0 0 28px rgba(0,136,218,.35))}
#logo img{position:absolute}
#txt .eyebrow{display:flex;align-items:center;font-weight:700;color:var(--blue);text-transform:uppercase}
#txt .eyebrow i{display:block;background:var(--blue)}
#txt .yr{font-weight:800;line-height:.86;letter-spacing:-0.03em;color:#fff;white-space:nowrap}
#txt .yr b{color:var(--blue);font-weight:800;margin-right:.18em}
#fw{inset:0;pointer-events:none}
#txt h1{font-weight:800;color:#fff;white-space:nowrap}
#txt h1 em{font-style:normal;color:var(--blue)}
#txt .rule{position:relative}
#txt .rule i,#txt .rule b{position:absolute;background:var(--blue)}
#txt .rule b{border-radius:50%}
#txt p{font-weight:500;color:#E9F0FB;white-space:nowrap}
#txt p.sig{font-weight:700;color:var(--blue)}
/* web v modrém políčku (stejně jako číslo na banneru) */
#tab{bottom:0;right:0;isolation:isolate;z-index:3;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-weight:600;white-space:nowrap}
#tab::before{content:"";position:absolute;z-index:-1;bottom:0;right:-4px;border-style:solid;border-color:rgba(0,136,218,.55);border-bottom:0;border-right:0}
</style>
</head>
<body>
<div id="c">
  <div id="glow"></div>
  <img id="lion" src="pozadi/lev-pf.png" alt="">
  <div id="marks"></div>
  <svg id="hex2" style="inset:0"></svg>
  <svg id="hex"></svg>
  <canvas id="fw"></canvas>
  <div id="logo"><img id="icon" src="assets/logo_icon_hd.png" alt=""><img src="assets/logo_word_white.png" id="word" alt=""></div>
  <div id="txt"></div>
  <div id="tab">www.BestAccount.cz</div>
</div>
<script>
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=s=>esc(s).replace(/\*([\s\S]+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
function hexes(W,H,u,cx,cy,rad){
  const R=118*u, w=Math.sqrt(3)*R, v=1.5*R;
  let s=`<defs><radialGradient id="m" cx="${cx}" cy="${cy}" r="${rad}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="k"><rect width="${W}" height="${H}" fill="url(#m)"/></mask></defs>`;
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647); let g='';
  for(let row=-2; row*v<H+2*R; row++) for(let col=-2; col*w<W+2*R; col++){
    const x=col*w+(row%2?w/2:0), y=row*v;
    if(Math.hypot(x-cx,y-cy)>rad+R) continue;
    const pts=[];for(let a=0;a<6;a++){const t=Math.PI/180*(60*a-90);pts.push((x+(R-4*u)*Math.cos(t)).toFixed(1)+','+(y+(R-4*u)*Math.sin(t)).toFixed(1));}
    const o=(0.12+rnd()*0.33).toFixed(2);
    g+=`<polygon points="${pts}" fill="#0E2A6E" fill-opacity="${o}" stroke="#1E9BE8" stroke-opacity=".95" stroke-width="${3*u}"/>`;
  }
  return s+`<g mask="url(#k)" style="filter:drop-shadow(0 0 ${8*u}px rgba(0,136,218,.5))">${g}</g>`;
}
function render(o){
  const W=o.w,H=o.h,u=H/1800,M=200*u;
  for(const el of [document.documentElement,document.body]) el.style.cssText=`width:${W}px;height:${H}px`;
  const c=document.getElementById('c'); c.style.width=W+'px'; c.style.height=H+'px';
  // lev vpravo – fotka plynule prolnutá do navy (vlevo a dole)
  const lw=o.lionW*u, lh=lw*1080/604, lx=W-lw+o.lionShift*u, ly=o.lionTop*u;
  const lion=document.getElementById('lion');
  Object.assign(lion.style,{left:lx+'px',top:ly+'px',width:lw+'px',height:lh+'px',
    webkitMaskImage:`linear-gradient(90deg,transparent 0,rgba(0,0,0,.18) ${lw*0.1}px,rgba(0,0,0,.6) ${lw*0.22}px,#000 ${lw*0.36}px), linear-gradient(0deg,transparent 0,#000 ${lh*0.22}px)`,
    webkitMaskComposite:'source-in'});
  document.getElementById('glow').style.background=[
    `radial-gradient(${1300*u}px ${900*u}px at ${W*0.47}px ${H*0.45}px, rgba(0,136,218,.16), rgba(0,136,218,0) 70%)`
  ].join(',');
  // průhledné logo v pozadí
  const ms=o.markSize*u;
  const mk=document.getElementById('marks'), mcx=o.markX*u, mcy=H/2+o.markDy*u;
  if(o.markMode==='fill'||o.markMode==='both'){ const oz=ms*3071/2831;
    mk.innerHTML=`<img src="assets/logo_icon_hd.png" style="left:${mcx-ms/2}px;top:${mcy-ms/2}px;width:${ms}px;height:${ms}px;opacity:.10;filter:none;transform:rotate(${o.markRot}deg)">`
      + (o.markMode==='both'?`<img src="assets/logo_obrys.png" style="left:${mcx-oz/2}px;top:${mcy-oz/2}px;width:${oz}px;height:${oz}px;opacity:.7;transform:rotate(${o.markRot}deg)">`:''); }
  else mk.innerHTML='';
  if(o.hexPhoto){ const hs=document.createElementNS('http://www.w3.org/2000/svg','svg'); }
  const ex=lx+lw*0.64, ey=ly+lh*0.52, rx=lw*0.48, ry=lh*0.56;
  mk.style.webkitMaskImage=`radial-gradient(${rx}px ${ry}px at ${ex}px ${ey}px, transparent 0%, transparent 40%, rgba(0,0,0,.4) 75%, #000 105%)`;
  // úl vlevo za textem
  const hx=document.getElementById('hex'); hx.setAttribute('viewBox',`0 0 ${W} ${H}`); hx.setAttribute('width',W); hx.setAttribute('height',H);
  hx.innerHTML=hexes(W,H,u,-60*u,H*0.66,1400*u);
  const h2=document.getElementById('hex2'); h2.setAttribute('viewBox',`0 0 ${W} ${H}`); h2.setAttribute('width',W); h2.setAttribute('height',H);
  h2.innerHTML = o.hexPhoto ? hexes(W,H,u,W+80*u,H*0.35,1150*u).replace(/id="m"/g,'id="m2"').replace(/url\(#m\)/g,'url(#m2)').replace(/id="k"/g,'id="k2"').replace(/url\(#k\)/g,'url(#k2)') : '';
  h2.style.opacity=.85;
  { const ex=W-o.lionW*u+o.lionShift*u+o.lionW*u*0.64, ly2=o.lionTop*u, lh2=o.lionW*u*1080/604, ey=ly2+lh2*0.45; h2.style.webkitMaskImage=`radial-gradient(${o.lionW*u*0.36}px ${lh2*0.46}px at ${ex}px ${ey}px, transparent 0%, transparent 50%, rgba(0,0,0,.4) 78%, #000 105%)`; }
  // logo
  const k=1.85*u, L=document.getElementById('logo');
  Object.assign(L.style,{left:(M-15*k)+'px',top:120*u+'px',width:388*k+'px',height:116*k+'px'});
  Object.assign(document.getElementById('icon').style,{left:10*k+'px',top:8*k+'px',width:101*k+'px',height:100*k+'px'});
  Object.assign(document.getElementById('word').style,{left:0,top:0,width:388*k+'px',height:116*k+'px'});
  // text – výrazná hierarchie
  const t=document.getElementById('txt');
  t.innerHTML=`
   <div class="yr" style="font-size:${o.yrSize*u}px;margin-left:${-14*u}px"><b>PF</b>2027</div>
   <h1 style="font-size:${158*u}px;line-height:${164*u}px;margin-top:${70*u}px;letter-spacing:-0.01em">${fmt(o.headline)}</h1>
   <p style="font-size:${86*u}px;line-height:${104*u}px;margin-top:${56*u}px">${fmt(o.body)}</p>
   <p class="sig" style="font-size:${104*u}px;line-height:${116*u}px;margin-top:${40*u}px">${fmt(o.sign)}</p>`;
  Object.assign(t.style,{left:M+'px',top:o.top*u+'px'});
  // web v modrém políčku vpravo dole
  const tb=document.getElementById('tab');
  Object.assign(tb.style,{width:o.tabW*u+'px',height:190*u+'px',fontSize:84*u+'px',borderTopLeftRadius:64*u+'px'});
  const st=document.createElement('style'); st.textContent=`#tab::before{top:${-20*u}px;left:${-20*u}px;border-width:${6*u}px;border-top-left-radius:${86*u}px}`; document.head.appendChild(st);
  // silvestr: ohňostroj + jiskry
  const cv=document.getElementById('fw'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  let seed=21; const r=()=>((seed=(seed*16807)%2147483647)/2147483647);
  x.globalCompositeOperation='lighter';
  for(const b of (o.bursts||[])){
    const bx=b[0]*u, by=b[1]*u, R=b[2]*u, cols=b[3];
    if(!R) continue;
    const g=x.createRadialGradient(bx,by,0,bx,by,R*0.9); g.addColorStop(0,'rgba(120,190,255,.22)'); g.addColorStop(1,'rgba(120,190,255,0)');
    x.fillStyle=g; x.beginPath(); x.arc(bx,by,R*0.9,0,7); x.fill();
    const N=b[4]||64;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2+r()*0.08, L=R*(0.72+r()*0.28), c=cols[i%cols.length], r0=R*0.08;
      const lg=x.createLinearGradient(bx+Math.cos(a)*r0,by+Math.sin(a)*r0,bx+Math.cos(a)*L,by+Math.sin(a)*L);
      lg.addColorStop(0,`rgba(${c},0)`); lg.addColorStop(.75,`rgba(${c},.55)`); lg.addColorStop(1,`rgba(${c},.95)`);
      x.strokeStyle=lg; x.lineWidth=(2.2+r()*1.6)*u; x.lineCap='round';
      x.beginPath(); x.moveTo(bx+Math.cos(a)*r0,by+Math.sin(a)*r0); x.lineTo(bx+Math.cos(a)*L,by+Math.sin(a)*L); x.stroke();
      x.shadowColor=`rgba(${c},1)`; x.shadowBlur=14*u; x.fillStyle=`rgba(${c},1)`;
      x.beginPath(); x.arc(bx+Math.cos(a)*L,by+Math.sin(a)*L,(3.2+r()*2.4)*u,0,7); x.fill();
      for(let k2=1;k2<=3;k2++){ const d=L+k2*R*0.06, dy=k2*k2*R*0.012; x.globalAlpha=0.6/k2;
        x.beginPath(); x.arc(bx+Math.cos(a)*d,by+Math.sin(a)*d+dy,2.2*u,0,7); x.fill(); }
      x.globalAlpha=1; x.shadowBlur=0;
    }
  }
  for(const sp of (o.sparkles||[])){ const sx=sp[0]*u, sy=sp[1]*u, sz=sp[2]*u;
    x.shadowColor='rgba(170,215,255,1)'; x.shadowBlur=18*u; x.fillStyle='rgba(235,245,255,.95)';
    x.beginPath(); x.moveTo(sx,sy-sz); x.quadraticCurveTo(sx,sy,sx+sz,sy); x.quadraticCurveTo(sx,sy,sx,sy+sz); x.quadraticCurveTo(sx,sy,sx-sz,sy); x.quadraticCurveTo(sx,sy,sx,sy-sz); x.fill(); x.shadowBlur=0; }
}
window.render=render;
</script>
</body>
</html>
