<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script></head><body>
<script type="module">
// Převod zapečeného AO ze slitého modelu (Blender) na pořadí vrcholů slitého modelu na webu → models/<id>.ao.bin
import * as THREE from 'three';
import { loadSolid } from './js/solid.js';
import { GLTFLoader } from './vendor/three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from './vendor/three/addons/libs/meshopt_decoder.module.js';
const id = new URLSearchParams(location.search).get('id');
const grp = await loadSolid('models/' + id + '.glb?' + Date.now());
const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
const g = await L.loadAsync('models/_tmp/' + id + '.ao.glb?' + Date.now()); g.scene.updateMatrixWorld(true);
const H = new Map(), C = 0.02, key = (x, y, z) => `${Math.round(x / C)},${Math.round(y / C)},${Math.round(z / C)}`, v = new THREE.Vector3(), nv = new THREE.Vector3();
g.scene.traverse((o) => { if (!o.isMesh) return; const P = o.geometry.attributes.position, N = o.geometry.attributes.normal, A = o.geometry.attributes.color, nm = new THREE.Matrix3().getNormalMatrix(o.matrixWorld);
  for (let k = 0; k < P.count; k++) { v.fromBufferAttribute(P, k).applyMatrix4(o.matrixWorld); nv.fromBufferAttribute(N, k).applyMatrix3(nm).normalize(); const kk = key(v.x, v.y, v.z); if (!H.has(kk)) H.set(kk, []); H.get(kk).push([v.x, v.y, v.z, nv.x, nv.y, nv.z, A ? A.getX(k) : 1]); } });
let total = 0; for (const m of grp.children) total += m.geometry.attributes.position.count;
const out = new Uint8Array(total); let o = 0, miss = 0;
for (const m of grp.children) { const P = m.geometry.attributes.position, N = m.geometry.attributes.normal;
  for (let k = 0; k < P.count; k++, o++) { v.fromBufferAttribute(P, k); nv.fromBufferAttribute(N, k);
    const cx = Math.round(v.x / C), cy = Math.round(v.y / C), cz = Math.round(v.z / C); let best = null, bd = 1e9;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) { const l = H.get(`${cx + dx},${cy + dy},${cz + dz}`); if (!l) continue;
      for (const q of l) { const d = (q[0] - v.x) ** 2 + (q[1] - v.y) ** 2 + (q[2] - v.z) ** 2 + 0.0004 * (1 - (q[3] * nv.x + q[4] * nv.y + q[5] * nv.z)); if (d < bd) { bd = d; best = q; } } }
    if (!best) miss++; out[o] = Math.round(255 * Math.min(1, Math.max(0, best ? best[6] : 1))); } }
window.__ao = Array.from(out); window.__info = { total, miss }; window.__done = true;
</script></body></html>
