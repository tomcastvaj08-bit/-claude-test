<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { loadLDraw, LDrawModel } from '../../js/ldmodel.js';
THREE.ColorManagement.enabled = false;
const q = new URLSearchParams(location.search), id = q.get('id'), S = 320;
const r = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true }); r.setSize(S, S); r.setPixelRatio(1);
r.outputColorSpace = THREE.LinearSRGBColorSpace; r.toneMapping = THREE.NoToneMapping;
document.body.appendChild(r.domElement);
const data = await loadLDraw('../../models/' + id + '.lbm');
const m = new LDrawModel(data); m.setProgress(0.5); m.setProgress(1);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0, 0, 0);
const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
// stejné geometrie, ale barva = ID dílku
const groups = new Map();
m.items.forEach((it, k) => { const key = it.geo; if (!groups.has(key)) groups.set(key, []); groups.get(key).push([it, k]); });
for (const [g, list] of groups) {
  const mesh = new THREE.InstancedMesh(m.geos[g], mat, list.length); mesh.frustumCulled = false;
  list.forEach(([it, k], j) => { mesh.setMatrixAt(j, it.m); const v = k + 1; mesh.setColorAt(j, new THREE.Color(((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255)); });
  sc.add(mesh);
}
const box = m.box, c = box.getCenter(new THREE.Vector3()), R = box.getSize(new THREE.Vector3()).length() * 0.62;
const cam = new THREE.OrthographicCamera(-R, R, R, -R, 0.1, R * 6);
const seen = new Set(); const px = new Uint8Array(S * S * 4);
const dirs = [];
for (let e = -1; e <= 5; e++) for (let a = 0; a < 16; a++) { const el = e * 0.26, az = (a / 16) * Math.PI * 2 + e * 0.2; dirs.push(new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az))); }
dirs.push(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0.01, -1, 0));
for (const d of dirs) {
  cam.position.copy(c).addScaledVector(d, R * 3); cam.up.set(0, Math.abs(d.y) > 0.99 ? 0 : 1, Math.abs(d.y) > 0.99 ? 1 : 0); cam.lookAt(c);
  r.render(sc, cam);
  const gl = r.getContext(); gl.readPixels(0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, px);
  for (let i = 0; i < px.length; i += 4) { const v = (px[i] << 16) | (px[i + 1] << 8) | px[i + 2]; if (v) seen.add(v - 1); }
}
// index v souboru = d.m pořadí; items mají it.i
window.__keep = [...seen].map((k) => m.items[k].i).sort((a, b) => a - b);
window.__total = m.items.length; window.__done = true;
</script></body></html>
