<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <script>/* /love-bricks → /love-bricks/ (relativní cesty) */ if (/\/love-bricks$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Love Bricks – galerie dárků z kostek</title>
  <meta name="description" content="Projdi se 3D galerií dárků z kostek: obří květiny, které nezvadnou. Pro páry, maminky i celé rodiny.">
  <meta name="theme-color" content="#F6F4F1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='28' height='20' rx='3' fill='%23D01012'/%3E%3Crect x='6' y='4' width='8' height='6' rx='1.5' fill='%23D01012'/%3E%3Crect x='18' y='4' width='8' height='6' rx='1.5' fill='%23D01012'/%3E%3Cpath d='M16 25s-6-3.6-6-7.6c0-2 1.5-3.4 3.2-3.4 1.2 0 2.2.7 2.8 1.7.6-1 1.6-1.7 2.8-1.7 1.7 0 3.2 1.4 3.2 3.4 0 4-6 7.6-6 7.6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gallery.css?v=20261114j">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
  <link rel="modulepreload" href="vendor/three/three.module.min.js">
</head>
<body class="gallery" data-page="gallery">
  <canvas id="gl" aria-label="3D galerie dárků z kostek"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="lb-header"></div>

  <!-- uvítání + právní odkazy -->
  <div class="welcome" aria-hidden="true"><span class="tile-print">Vítej v galerii <b>Love Bricks</b></span><small>Klepni na cokoli, co tě zaujme</small></div>
  <nav class="corner-legal" aria-label="Právní informace">
    <a href="obchodni-podminky.html">Obchodní podmínky</a>
    <a href="ochrana-osobnich-udaju.html">Soukromí</a>
    <a href="cookies.html">Cookies</a>
    <a href="prehled.html">Přehled kolekce</a>
  </nav>

  <!-- tlačítko na drátku: posune o krok dál -->
  <div class="hang">
    <span class="hang-wire" aria-hidden="true"></span>
    <button class="hang-box" data-fwd type="button" aria-label="Dál – posunout se k dalším exponátům">
      <svg class="hang-svg" viewBox="0 0 124 124" aria-hidden="true">
        <defs>
          <linearGradient id="hbFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5f66"/><stop offset=".55" stop-color="#43464c"/><stop offset="1" stop-color="#33353a"/></linearGradient>
          <linearGradient id="hbSideR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2c30"/><stop offset="1" stop-color="#1c1d20"/></linearGradient>
          <linearGradient id="hbSideB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232427"/><stop offset="1" stop-color="#161719"/></linearGradient>
          <linearGradient id="hbShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <radialGradient id="hbSpill" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff3b2f" stop-opacity=".6"/><stop offset=".55" stop-color="#ff2a20" stop-opacity=".2"/><stop offset="1" stop-color="#ff2a20" stop-opacity="0"/></radialGradient>
          <linearGradient id="hbStudG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#666a71"/><stop offset="1" stop-color="#4a4d53"/></linearGradient>
          <radialGradient id="hbPlate" cx=".4" cy=".36" r=".72"><stop offset="0" stop-color="#ff6f5e"/><stop offset=".45" stop-color="#ec1d1b"/><stop offset=".85" stop-color="#b10b14"/><stop offset="1" stop-color="#ff5a4c"/></radialGradient>
          <radialGradient id="hbStud" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#ffb3a6"/><stop offset=".35" stop-color="#ff4a3c"/><stop offset=".8" stop-color="#d4121a"/><stop offset="1" stop-color="#9c0812"/></radialGradient>
          <radialGradient id="hbCore" cx=".45" cy=".42" r=".6"><stop offset="0" stop-color="#ffe0d8" stop-opacity=".75"/><stop offset=".6" stop-color="#ff7060" stop-opacity=".25"/><stop offset="1" stop-color="#ff4030" stop-opacity="0"/></radialGradient>
          <filter id="hbBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
          <filter id="hbSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3"/></filter>
          <clipPath id="hbClip"><rect x="4" y="4" width="104" height="104" rx="2.5"/></clipPath>
          <!-- výstupek (stud) viděný shora: stín, bok, horní plocha, odlesk -->
          <g id="hbS">
            <circle cx="2.6" cy="3.2" r="10.6" fill="#000" fill-opacity=".38" filter="url(#hbSoft)"/>
            <circle cx="1.5" cy="1.9" r="10.4" fill="#26282c"/>
            <circle r="10.4" fill="url(#hbStudG)"/>
            <circle r="9.7" fill="none" stroke="#a4a8b0" stroke-opacity=".45" stroke-width="1.1"/>
            <path d="M6.9 6.9 A9.7 9.7 0 0 1 -6.9 6.9" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1.2"/>
            <path d="M-7.4 -3 A8 8 0 0 1 -2.8 -7.6" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
          </g>
        </defs>
        <!-- tloušťka destičky (vpravo a dole) -->
        <path d="M106 5 L116 15 L116 113 Q116 116 113 116 L15 116 L5 106 Z" fill="url(#hbSideB)"/>
        <path d="M106 5 L116 15 L116 113 L106 106 Z" fill="url(#hbSideR)"/>
        <path d="M107.4 6.4 L115 14" stroke="#7a7e85" stroke-opacity=".45" stroke-width="1"/>
        <path d="M6.4 107.4 L14 115" stroke="#7a7e85" stroke-opacity=".25" stroke-width="1"/>
        <!-- horní plocha destičky 3x3 -->
        <rect x="4" y="4" width="104" height="104" rx="2.5" fill="url(#hbFace)"/>
        <g clip-path="url(#hbClip)">
          <circle class="hb-spill" cx="56" cy="56" r="58" fill="url(#hbSpill)"/>
        </g>
        <path d="M5 104 L5 6.5 Q5 5 6.5 5 L104 5" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
        <rect x="4.5" y="4.5" width="103" height="103" rx="2.2" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1"/>
        <use href="#hbS" x="21.33" y="21.33"/><use href="#hbS" x="21.33" y="56.00"/><use href="#hbS" x="21.33" y="90.67"/><use href="#hbS" x="56.00" y="21.33"/><use href="#hbS" x="56.00" y="90.67"/><use href="#hbS" x="90.67" y="21.33"/><use href="#hbS" x="90.67" y="56.00"/><use href="#hbS" x="90.67" y="90.67"/>
        <g clip-path="url(#hbClip)"><rect class="hb-shine" x="-60" y="-40" width="30" height="200" fill="url(#hbShine)"/></g>
        <!-- svítící průhledný červený kulatý dílek 1x1 -->
        <circle class="hb-halo" cx="56" cy="56" r="26" fill="#ff2a1f" filter="url(#hbBlur)"/>
        <circle cx="58.4" cy="59" r="21.5" fill="#5e0610" fill-opacity=".85"/>
        <circle cx="56" cy="56" r="21.5" fill="url(#hbPlate)" fill-opacity=".96"/>
        <circle cx="56" cy="56" r="18.6" fill="none" stroke="#6e0010" stroke-opacity=".35" stroke-width="2"/>
        <circle cx="56" cy="56" r="20.8" fill="none" stroke="#ffc0b6" stroke-opacity=".6" stroke-width="1.2"/>
        <path d="M66 73 A19 19 0 0 0 73 64" fill="none" stroke="#ffd0c8" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
        <circle cx="57.6" cy="58" r="14.6" fill="#7a0610" fill-opacity=".8"/>
        <circle cx="55.6" cy="55.6" r="14.6" fill="url(#hbStud)"/>
        <circle class="hb-core" cx="55.6" cy="55.6" r="14.6" fill="url(#hbCore)"/>
        <circle cx="55.6" cy="55.6" r="14" fill="none" stroke="#ffd9d2" stroke-opacity=".75" stroke-width="1"/>
        <path d="M39.5 47 A18 18 0 0 1 47 39.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
        <!-- nápis Dál vytlačený na výstupku -->
        <text class="hb-txt" x="56.1" y="59.6" text-anchor="middle" fill="#6a0410" fill-opacity=".6">DÁL</text>
        <text class="hb-txt" x="55.6" y="59" text-anchor="middle" fill="#fff">DÁL</text>
      </svg>
    </button>
  </div>
  <div class="warp-flash" aria-hidden="true"></div>

  <!-- ovládání v galerii -->
  <div class="hud" aria-label="Ovládání galerie">
    <div class="hud-ctrl">
      <button class="brick-btn white icon" data-studs data-back type="button" aria-label="Zpět k předchozímu exponátu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <p class="hud-hint">Klepni na exponát · scrolluj nebo swipni pro chůzi</p>
  </div>

  <!-- detail exponátu -->
  <aside class="ex-panel brick-card" id="ex-panel" data-studs aria-hidden="true" aria-labelledby="ex-title" role="dialog">
    <div class="ex-top">
      <button class="brick-btn sm white" data-studs data-unfocus type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Zpět do galerie</button>
      <span class="ex-nav">
        <button class="brick-btn sm white icon" data-studs data-prev-ex type="button" aria-label="Předchozí exponát"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="brick-btn sm white icon" data-studs data-next-ex type="button" aria-label="Další exponát"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </span>
    </div>
    <div class="ex-scroll"></div>
    <div class="ex-buy buy">
      <div class="price brick ex-price" data-studs><span data-price></span></div>
      <button class="brick-btn" data-studs data-add="" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16l-1.3 12H5.3z"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3"/></svg> Do košíku</button>
    </div>
  </aside>

  <noscript><p style="position:fixed;inset:auto 0 0;text-align:center;padding:20px;background:#fff">Galerie potřebuje JavaScript. <a href="prehled.html">Otevřít přehled kolekce</a>.</p></noscript>
  <script type="module" src="js/gallery.js?v=20261114j"></script>
</body>
</html>
